  ctx.textAlign = 'center';
  ctx.fillStyle = COL.textBright;
  ctx.font = 'bold 36px "Courier New"';

  ctx.font = 'bold 20px "Courier New"';

  ctx.font = '16px "Courier New"';

  ctx.font = 'bold 22px "Courier New"';
  ctx.fillText('SPICE: ' + player.spice, W/2, H/2 + 80);

  if (Math.floor(frameCount / 30) % 2 === 0) {
    ctx.fillStyle = COL.text;
    ctx.font = 'bold 16px "Courier New"';
    ctx.fillText('PRESS SPACE', W/2, H/2 + 130);
  }
  ctx.textAlign = 'left';
}

// ============================================================
// SANDRIDER LEVEL - Paul rides Shai-Hulud, eats Harkonnens
// ============================================================
let sandrider = null;

const SAND_TOP = Math.floor(H * 0.38); // top of sand area

function initSandrider() {
  sandrider = {
    x: W * 0.15,
    y: H * 0.6,
    w: 80,
    h: 60,
    speed: 5,
    score: 0,
    targetScore: 30,
    scrollSpeed: 3,
    bgOffset: 0,
    duneOffsets: [],
    troops: [],
    rocks: [],
    labyrinths: [],
    spawnTimer: 0,
    spawnRate: 55,
    rockSpawnTimer: 0,
    rockSpawnRate: 80,
    labyrinthTimer: 0,
    labyrinthRate: 400,
    particles: [],
    shakeAmount: 0,
    shakeDuration: 0,
    timer: 0,
    hp: 3,
    maxHp: 3,
    invincible: 0,
    phase: 'riding',
    victoryTimer: 0,
    wormAngle: 0,
    dustTrails: [],
  };
  for (let layer = 0; layer < 3; layer++) {
    sandrider.duneOffsets.push({
      offset: 0,
      speed: 1 + layer * 0.8,
      y: H * 0.7 + layer * 30,
      height: 40 + layer * 20,
      color: layer === 0 ? '#D4A574' : layer === 1 ? '#C49A6C' : '#B08858',
    });
  }
  playMusic(musicSandrider);
}

function updateSandrider() {
  if (!sandrider) return;
  const sr = sandrider;
  sr.timer++;

  if (sr.phase === 'harvester') {
    sr.harvesterTimer++;
    // Slow down scrolling gradually
    const slowdown = Math.max(0.3, 1 - sr.harvesterTimer / 300);
    sr.bgOffset += sr.scrollSpeed * slowdown;
    sr.duneOffsets.forEach(d => d.offset += d.speed * slowdown);
    // Harvester slides in slowly from right
    sr.harvesterX = Math.max(W * 0.45, sr.harvesterX - 1.2);
    // Worm auto-steers toward harvester gently
    const targetX = sr.harvesterX - 50;
    const targetY = H * 0.58;
    sr.x += (targetX - sr.x) * 0.012;
    sr.y += (targetY - sr.y) * 0.012;
    sr.wormAngle = Math.sin(sr.timer * 0.05) * 0.08;
    // After worm arrives near harvester, wait a beat then show victory
    const arrived = Math.abs(sr.x - targetX) < 30 && sr.harvesterTimer > 120;
    if (arrived && !sr.harvesterArrived) {
      sr.harvesterArrived = true;
      sr.harvesterWaitTimer = 0;
    }
    if (sr.harvesterArrived) {
      sr.harvesterWaitTimer++;
      // Let player see the scene briefly then start boarding
      if (sr.harvesterWaitTimer > 80) {
        sr.phase = 'boarding';
        sr.boardingTimer = 0;
        // Paul & Chani jump off worm positions
        sr.paulPos = { x: sr.x + sr.w / 2, y: sr.y - 10 };
        sr.chaniPos = { x: sr.x + sr.w / 2 + 20, y: sr.y - 10 };
        sr.spiceLoaded = false;
        sr.crawlerDriving = false;
      }
    }
    return;
  }

  if (sr.phase === 'boarding') {
    sr.boardingTimer++;
    sr.bgOffset += sr.scrollSpeed * 0.2;
    sr.duneOffsets.forEach(d => d.offset += d.speed * 0.2);
    sr.wormAngle *= 0.98;

    const harvCenterX = sr.harvesterX + 100;
    const harvDoorY = H * 0.35 + 100;

    // Phase 1: Paul & Chani jump off worm and run to harvester (0-120)
    if (sr.boardingTimer < 120) {
      const t = sr.boardingTimer / 120;
      // Paul runs to harvester door
      sr.paulPos.x += (harvCenterX - 30 - sr.paulPos.x) * 0.04;
      sr.paulPos.y += (harvDoorY - sr.paulPos.y) * 0.04;
      // Chani follows slightly behind
      sr.chaniPos.x += (harvCenterX - sr.chaniPos.x) * 0.035;
      sr.chaniPos.y += (harvDoorY - sr.chaniPos.y) * 0.035;
    }
    // Phase 2: Load spice into crawler (120-200)
    else if (sr.boardingTimer < 200) {
      if (!sr.spiceLoaded) {
        sr.spiceLoaded = true;
        sr.spiceParticles = [];
      }
      // Spice particles flowing into harvester
      if (sr.boardingTimer % 4 === 0) {
        for (let i = 0; i < 3; i++) {
          sr.spiceParticles.push({
            x: sr.paulPos.x + (Math.random() - 0.5) * 40,
            y: sr.paulPos.y - 20 - Math.random() * 30,
            targetX: harvCenterX,
            targetY: harvDoorY - 30,
            life: 40,
            maxLife: 40,
            size: 2 + Math.random() * 3,
          });
        }
      }
      if (sr.spiceParticles) {
        sr.spiceParticles = sr.spiceParticles.filter(p => {
          p.x += (p.targetX - p.x) * 0.08;
          p.y += (p.targetY - p.y) * 0.08;
          p.life--;
          return p.life > 0;
        });
      }
    }
    // Phase 3: Board crawler and drive toward Arrakeen (200+)
    else {
      if (!sr.crawlerDriving) {
        sr.crawlerDriving = true;
        sr.paulPos = null;
        sr.chaniPos = null;
      }
      // Harvester drives left toward Arrakeen
      sr.harvesterX -= 2.5;
      sr.scrollSpeed = Math.min(sr.scrollSpeed + 0.02, 5);
      sr.bgOffset += sr.scrollSpeed * 0.5;
      sr.duneOffsets.forEach(d => d.offset += d.speed * 0.5);

      // Worm sinks away
      sr.y += 1;

      if (sr.boardingTimer > 340) {
        sr.phase = 'victory';
        sr.victoryTimer = 0;
        playMusic(musicVictory);
      }
    }
    return;
  }

  if (sr.phase === 'victory') {
    sr.victoryTimer++;
    sr.bgOffset += sr.scrollSpeed * 0.3;
    sr.duneOffsets.forEach(d => d.offset += d.speed * 0.3);
    if (sr.victoryTimer > 240 || wasPressed('Space')) {
      sandrider = null;
      initThopter();
      gameState = 'thopter';
    }
    return;
  }

  if (sr.phase === 'dead') {
    sr.victoryTimer++;
    // Worm sinks into the sand
    sr.y += 0.8;
    sr.wormAngle *= 0.98;
    sr.shakeAmount = 0;
    // Slow down scrolling
    const fade = Math.max(0, 1 - sr.victoryTimer / 120);
    sr.bgOffset += sr.scrollSpeed * fade;
    sr.duneOffsets.forEach(d => d.offset += d.speed * fade);
    // Spawn sand dust as worm sinks
    if (sr.victoryTimer < 90 && sr.victoryTimer % 4 === 0) {
      for (let i = 0; i < 3; i++) {
        sr.dustTrails.push({
          x: sr.x + sr.w / 2 + (Math.random() - 0.5) * sr.w,
          y: Math.min(sr.y + sr.h / 2, H - 20),
          size: 5 + Math.random() * 8,
          life: 40,
          maxLife: 40,
          vx: (Math.random() - 0.5) * 2,
          vy: -0.5 - Math.random(),
        });
      }
    }
    sr.dustTrails = sr.dustTrails.filter(d => {
      d.x += d.vx; d.y += d.vy; d.life--;
      return d.life > 0;
    });
    if (sr.victoryTimer > 250 || (sr.victoryTimer > 120 && wasPressed('Space'))) {
      gameState = 'title';
      titleMusicStarted = false;
      stopMusic();
      sandrider = null;
    }
    return;
  }

  // Worm undulation
  sr.wormAngle = Math.sin(sr.timer * 0.05) * 0.15;

  // Move worm in all directions
  if (keys['ArrowLeft'] || keys['KeyA']) sr.x -= sr.speed;
  if (keys['ArrowRight'] || keys['KeyD']) sr.x += sr.speed;
  if (keys['ArrowUp'] || keys['KeyW']) sr.y -= sr.speed;
  if (keys['ArrowDown'] || keys['KeyS']) sr.y += sr.speed;
  // Clamp to sand area only (not in the sky)
  sr.x = Math.max(10, Math.min(W - sr.w - 10, sr.x));
  sr.y = Math.max(SAND_TOP, Math.min(H - sr.h - 10, sr.y));

  // Invincibility frames
  if (sr.invincible > 0) sr.invincible--;

  // Scroll background
  sr.bgOffset += sr.scrollSpeed;
  sr.duneOffsets.forEach(d => d.offset += d.speed);

  // Spawn dust trails behind worm (to the left, since worm moves right)
  if (sr.timer % 3 === 0) {
    sr.dustTrails.push({
      x: sr.x - 5,
      y: sr.y + sr.h / 2 + (Math.random() - 0.5) * 20,
      size: 4 + Math.random() * 6,
      life: 30,
      maxLife: 30,
      vx: -1 - Math.random(),
      vy: (Math.random() - 0.5) * 0.5,
    });
  }

  // Update dust trails
  sr.dustTrails = sr.dustTrails.filter(d => {
    d.x += d.vx;
    d.y += d.vy;
    d.life--;
    return d.life > 0;
  });

  // Spawn single rocks from right side
  sr.rockSpawnTimer++;
  if (sr.rockSpawnTimer >= sr.rockSpawnRate) {
    sr.rockSpawnTimer = 0;
    sr.rockSpawnRate = Math.max(45, 80 - Math.floor(sr.score / 8) * 5);
    const rockSize = 35 + Math.random() * 30;
    sr.rocks.push({
      x: W + 60,
      y: SAND_TOP + 10 + Math.random() * (H - SAND_TOP - 80),
      w: rockSize,
      h: rockSize * 0.8,
      speed: sr.scrollSpeed,
    });
  }

  // Spawn rock labyrinths (walls of rocks with a gap to navigate through)
  sr.labyrinthTimer++;
  if (sr.labyrinthTimer >= sr.labyrinthRate) {
    sr.labyrinthTimer = 0;
    sr.labyrinthRate = Math.max(250, 400 - Math.floor(sr.score / 5) * 20);
    const sandH = H - SAND_TOP - 10;
    const gapSize = 80 + Math.random() * 40;
    const gapY = SAND_TOP + 20 + Math.random() * (sandH - gapSize - 40);
    // First wall of rocks with a gap
    for (let ry = SAND_TOP; ry < H - 10; ry += 42) {
      if (ry + 20 > gapY && ry < gapY + gapSize) continue;
      sr.rocks.push({
        x: W + 60,
        y: ry,
        w: 40,
        h: 38,
        speed: sr.scrollSpeed,
      });
    }
    // Second wall offset with different gap
    const gapY2 = SAND_TOP + 20 + Math.random() * (sandH - gapSize - 40);
    for (let ry = SAND_TOP; ry < H - 10; ry += 42) {
      if (ry + 20 > gapY2 && ry < gapY2 + gapSize) continue;
      sr.rocks.push({
        x: W + 170,
        y: ry,
        w: 40,
        h: 38,
        speed: sr.scrollSpeed,
      });
    }
  }

  // Update rocks (move left)
  sr.rocks = sr.rocks.filter(r => {
    r.x -= sr.scrollSpeed;
    // Check collision with worm
    if (sr.invincible <= 0) {
      const cx = sr.x + sr.w / 2;
      const cy = sr.y + sr.h / 2;
      const rx = r.x + r.w / 2;
      const ry = r.y + r.h / 2;
      const dx = cx - rx;
      const dy = cy - ry;
      if (Math.abs(dx) < (sr.w + r.w) * 0.35 && Math.abs(dy) < (sr.h + r.h) * 0.35) {
        sr.hp--;
        sr.invincible = 60;
        sr.shakeAmount = 8;
        sr.shakeDuration = 12;
        sfx('worm_hurt');
        for (let i = 0; i < 6; i++) {
          sr.particles.push({
            x: cx, y: cy,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 15 + Math.random() * 10,
            color: '#8B7355',
            size: 3 + Math.random() * 3,
          });
        }
        if (sr.hp <= 0) {
          sr.phase = 'dead';
          sr.victoryTimer = 0;
          sr.shakeAmount = 0;
          sr.shakeDuration = 0;
          sfx('worm_hurt');
          stopMusic();
        }
      }
    }
    return r.x > -80;
  });

  // Spawn troops from right (Paul steers into them to devour)
  sr.spawnTimer++;
  if (sr.spawnTimer >= sr.spawnRate) {
    sr.spawnTimer = 0;
    sr.spawnRate = Math.max(30, 55 - Math.floor(sr.score / 5) * 4);
    const isSardaukar = sr.score >= 5 && Math.random() < 0.35;
    sr.troops.push({
      x: W + 30,
      y: SAND_TOP + 10 + Math.random() * (H - SAND_TOP - 60),
      w: isSardaukar ? 52 : 44,
      h: isSardaukar ? 44 : 36,
      speed: isSardaukar ? 1.5 : 2 + Math.random() * 1,
      alive: true,
      deathTimer: 0,
      type: isSardaukar ? 'sardaukar' : 'harkonnen',
      points: isSardaukar ? 2 : 1,
    });
  }

  // Update troops (scroll left, Paul steers into them to eat)
  sr.troops = sr.troops.filter(t => {
    if (!t.alive) {
      t.deathTimer++;
      return t.deathTimer < 20;
    }
    t.x -= t.speed + sr.scrollSpeed;
    // Check collision with worm (eat!)
    const cx = sr.x + sr.w / 2;
    const cy = sr.y + sr.h / 2;
    const tx = t.x + t.w / 2;
    const ty = t.y + t.h / 2;
    const dist = Math.sqrt((cx - tx) ** 2 + (cy - ty) ** 2);
    if (dist < 45) {
      t.alive = false;
      sr.score += t.points;
      sr.shakeAmount = 5;
      sr.shakeDuration = 8;
      sfx('worm_eat');
      for (let i = 0; i < 8; i++) {
        sr.particles.push({
          x: tx, y: ty,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20 + Math.random() * 10,
          color: t.type === 'sardaukar' ? '#444' : (Math.random() > 0.5 ? '#8B0000' : '#555'),
          size: 3 + Math.random() * 4,
        });
      }
      if (sr.score >= sr.targetScore && sr.phase === 'riding') {
        sr.phase = 'harvester';
        sr.harvesterX = W + 100;
        sr.harvesterTimer = 0;
        sfx('victory');
      }
    }
    return t.x > -80;
  });

  // Update particles
  sr.particles = sr.particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vx *= 0.95;
    p.vy *= 0.95;
    return p.life > 0;
  });

  // Shake
  if (sr.shakeDuration > 0) sr.shakeDuration--;
  else sr.shakeAmount = 0;
}

function drawSandrider() {
  if (!sandrider) return;
  const sr = sandrider;

  ctx.save();
  // Screen shake
  if (sr.shakeAmount > 0) {
    ctx.translate(
      (Math.random() - 0.5) * sr.shakeAmount * 2,
      (Math.random() - 0.5) * sr.shakeAmount * 2
    );
  }

  // Draw angled desert sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, SAND_TOP);
  skyGrad.addColorStop(0, '#1a0a00');
  skyGrad.addColorStop(0.3, '#4a2000');
  skyGrad.addColorStop(0.7, '#c47020');
  skyGrad.addColorStop(1, '#EDC9AF');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, SAND_TOP);

  // Desert ground - use sand texture if available
  const sandImg = spriteImages.sand_ground;
  if (sandImg && sandImg.complete && sandImg.naturalWidth > 0) {
    // Tile the sand texture horizontally with scroll offset
    const texW = W;
    const texH = H - SAND_TOP;
    const scrollX = (-sr.bgOffset * 1.5) % texW;
    ctx.drawImage(sandImg, scrollX, SAND_TOP, texW, texH);
    ctx.drawImage(sandImg, scrollX + texW, SAND_TOP, texW, texH);
    if (scrollX > 0) ctx.drawImage(sandImg, scrollX - texW, SAND_TOP, texW, texH);
  } else {
    const groundGrad = ctx.createLinearGradient(0, SAND_TOP, 0, H);
    groundGrad.addColorStop(0, '#EDC9AF');
    groundGrad.addColorStop(0.3, '#D4A574');
    groundGrad.addColorStop(1, '#C49A6C');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, SAND_TOP, W, H - SAND_TOP);
  }

  // Scrolling sand marks (moving right to left as Paul rides forward)
  ctx.fillStyle = 'rgba(160, 120, 80, 0.15)';
  const sandArea = H - SAND_TOP;
  for (let i = 0; i < 15; i++) {
    const baseX = (((i * 97 - sr.bgOffset * (0.5 + i * 0.1)) % (W + 60)) + W + 60) % (W + 60) - 30;
    const baseY = SAND_TOP + 10 + (i * 37 % (sandArea - 20));
    ctx.beginPath();
    ctx.ellipse(baseX, baseY, 15, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Dune silhouettes in the distance (parallax, scrolling left)
  sr.duneOffsets.forEach((layer, li) => {
    ctx.fillStyle = layer.color;
    ctx.globalAlpha = 0.4 - li * 0.1;
    ctx.beginPath();
    ctx.moveTo(0, SAND_TOP);
    for (let x = 0; x <= W; x += 5) {
      const duneY = SAND_TOP - 5 - layer.height *
        Math.sin((x - layer.offset) * 0.008 + li * 2) *
        Math.sin((x - layer.offset) * 0.003 + li);
      ctx.lineTo(x, duneY);
    }
    ctx.lineTo(W, SAND_TOP);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Draw dust trails
  sr.dustTrails.forEach(d => {
    ctx.globalAlpha = (d.life / d.maxLife) * 0.4;
    ctx.fillStyle = '#D4A574';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size * (1 - d.life / d.maxLife) + 2, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Draw rocks (planted in the sand)
  sr.rocks.forEach(r => {
    // Sand mound at base (rock emerges from ground)
    ctx.fillStyle = '#C4956A';
    ctx.beginPath();
    ctx.ellipse(r.x + r.w / 2, r.y + r.h * 0.85, r.w * 0.7, r.h * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#B08858';
    ctx.beginPath();
    ctx.ellipse(r.x + r.w / 2, r.y + r.h * 0.9, r.w * 0.6, r.h * 0.15, 0, 0, Math.PI);
    ctx.fill();
    // Shadow on ground
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(r.x + r.w / 2 + 5, r.y + r.h * 0.9, r.w * 0.5, r.h * 0.12, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Rock sprite or fallback
    const rockImg = spriteImages.rock_obstacle;
    if (rockImg && rockImg.complete && rockImg.naturalWidth > 0) {
      ctx.drawImage(rockImg, r.x, r.y, r.w, r.h * 0.9);
    } else {
      ctx.fillStyle = '#6B5642';
      ctx.beginPath();
      ctx.ellipse(r.x + r.w / 2, r.y + r.h * 0.4, r.w / 2, r.h * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5A4A38';
      ctx.beginPath();
      ctx.ellipse(r.x + r.w * 0.4, r.y + r.h * 0.3, r.w * 0.2, r.h * 0.15, -0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Draw troops (harkonnen and sardaukar)
  sr.troops.forEach(t => {
    if (!t.alive) {
      ctx.globalAlpha = 1 - t.deathTimer / 20;
      ctx.fillStyle = '#FF4400';
      ctx.fillRect(t.x - 2, t.y - 2, t.w + 4, t.h + 4);
    }
    const perspScale = 0.5 + (t.y / H) * 0.7;
    const drawW = t.w * perspScale;
    const drawH = t.h * perspScale;
    const drawX = t.x + (t.w - drawW) / 2;
    const drawY = t.y + (t.h - drawH) / 2;

    // Use sprite based on type
    const spriteKey = t.type === 'sardaukar' ? 'sardaukar' : 'harkonnen_group';
    if (spriteImages[spriteKey] && spriteImages[spriteKey].complete) {
      ctx.drawImage(spriteImages[spriteKey], drawX, drawY, drawW, drawH);
    } else {
      ctx.fillStyle = t.type === 'sardaukar' ? '#555' : COL.harkonnen;
      ctx.fillRect(drawX, drawY, drawW, drawH);
      ctx.fillStyle = t.type === 'sardaukar' ? '#888' : '#333';
      ctx.fillRect(drawX + 4, drawY + 4, drawW - 8, drawH * 0.3);
    }
    // Show point value for sardaukar
    if (t.alive && t.type === 'sardaukar') {
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold ' + Math.floor(10 * perspScale) + 'px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('x2', drawX + drawW / 2, drawY - 2);
      ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;
  });

  // Draw particles
  sr.particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Draw spice harvester (during harvester/boarding/victory phase)
  if ((sr.phase === 'harvester' || sr.phase === 'boarding' || sr.phase === 'victory') && sr.harvesterX != null) {
    const hx = sr.harvesterX;
    const hy = H * 0.35;
    const hw = 200;
    const hh = 140;
    // Shadow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(hx + hw / 2, hy + hh + 10, hw * 0.4, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Harvester sprite or fallback
    const harvImg = spriteImages.spice_harvester;
    if (harvImg && harvImg.complete && harvImg.naturalWidth > 0) {
      ctx.drawImage(harvImg, hx, hy, hw, hh);
    } else {
      ctx.fillStyle = '#8B6914';
      ctx.fillRect(hx, hy + 20, hw, hh - 20);
      ctx.fillStyle = '#666';
      ctx.fillRect(hx + 10, hy, hw - 20, 30);
      ctx.fillStyle = '#444';
      ctx.fillRect(hx + 30, hy + hh - 20, 30, 20);
      ctx.fillRect(hx + hw - 60, hy + hh - 20, 30, 20);
    }
    // Label
    if (sr.phase === 'harvester' && sr.harvesterTimer > 30) {
      const labelAlpha = Math.min(1, (sr.harvesterTimer - 30) / 30);
      ctx.globalAlpha = labelAlpha;
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 16px "Courier New"';
      ctx.fillText('SPICE HARVESTER', hx + hw / 2, hy - 10);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }

  // Draw boarding sequence (Paul & Chani + spice loading)
  if (sr.phase === 'boarding') {
    // Draw Paul
    if (sr.paulPos) {
      const paulSprite = spriteImages.paul_side;
      if (paulSprite && paulSprite.complete && paulSprite.naturalWidth > 0) {
        ctx.drawImage(paulSprite, sr.paulPos.x - 10, sr.paulPos.y - 20, 20, 28);
      } else {
        ctx.fillStyle = COL.fremen;
        ctx.fillRect(sr.paulPos.x - 6, sr.paulPos.y - 16, 12, 20);
        ctx.fillStyle = '#D2B48C';
        ctx.beginPath();
        ctx.arc(sr.paulPos.x, sr.paulPos.y - 20, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Draw Chani
    if (sr.chaniPos) {
      const chaniSprite = spriteImages.chani;
      if (chaniSprite && chaniSprite.complete && chaniSprite.naturalWidth > 0) {
        ctx.drawImage(chaniSprite, sr.chaniPos.x - 10, sr.chaniPos.y - 20, 20, 28);
      } else {
        ctx.fillStyle = '#2C4370';
        ctx.fillRect(sr.chaniPos.x - 5, sr.chaniPos.y - 14, 10, 18);
        ctx.fillStyle = '#D2B48C';
        ctx.beginPath();
        ctx.arc(sr.chaniPos.x, sr.chaniPos.y - 18, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Draw spice particles flowing into harvester
    if (sr.spiceParticles) {
      sr.spiceParticles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = COL.spice;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        // Spice glow
        ctx.fillStyle = COL.spiceGlow;
        ctx.globalAlpha = (p.life / p.maxLife) * 0.4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 1.8, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    // Status text
    if (sr.boardingTimer > 30 && sr.boardingTimer < 120) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 14px "Courier New"';
      ctx.fillText('Paul and Chani dismount Shai-Hulud...', W / 2, H - 30);
      ctx.textAlign = 'left';
    } else if (sr.boardingTimer >= 120 && sr.boardingTimer < 200) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.spice;
      ctx.font = 'bold 14px "Courier New"';
      ctx.fillText('Loading spice into the crawler...', W / 2, H - 30);
      ctx.textAlign = 'left';
    } else if (sr.boardingTimer >= 200) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 14px "Courier New"';
      ctx.fillText('Heading to Arrakeen!', W / 2, H - 30);
      ctx.textAlign = 'left';
    }
  }

  // Draw sandworm with Paul & Chani riding (uses sprite image)
  // Blink when invincible
  if (sr.invincible <= 0 || Math.floor(sr.timer / 4) % 2 === 0) {
    ctx.save();
    const wormCx = sr.x + sr.w / 2;
    const wormCy = sr.y + sr.h / 2;
    // Worm shadow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(wormCx, sr.y + sr.h + 10, sr.w * 0.7, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.translate(wormCx, wormCy);
    ctx.rotate(sr.wormAngle);

    const wormSprite = sr.phase === 'dead' ? spriteImages.sandrider_dead : spriteImages.sandrider;
    if (wormSprite && wormSprite.complete && wormSprite.naturalWidth > 0) {
      // Draw the sprite (includes Paul & Chani)
      const drawW = sr.w;
      const drawH = sr.h;
      ctx.drawImage(wormSprite, -drawW / 2, -drawH / 2, drawW, drawH);
    } else {
      // Procedural fallback
      ctx.fillStyle = COL.worm;
      ctx.beginPath();
      ctx.ellipse(0, 0, sr.w / 2, sr.h / 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COL.wormMouth;
      ctx.beginPath();
      ctx.arc(0, -sr.h / 4, 8, 0, Math.PI * 2);
      ctx.fill();
      // Paul
      ctx.fillStyle = COL.fremen;
      ctx.fillRect(-6, -sr.h / 3 - 12, 12, 14);
      // Chani
      ctx.fillStyle = '#2C4370';
      ctx.fillRect(10, -sr.h / 3 - 12, 10, 12);
    }
    ctx.restore();
  }

  // HUD
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(0, 0, W, 42);

  ctx.textAlign = 'left';
  ctx.fillStyle = COL.textBright;
  ctx.font = 'bold 16px "Courier New"';
  ctx.fillText('SANDRIDER', 10, 18);

  // HP hearts
  for (let i = 0; i < sr.maxHp; i++) {
    ctx.fillStyle = i < sr.hp ? COL.heart : COL.heartEmpty;
    ctx.font = '14px "Courier New"';
    ctx.fillText(i < sr.hp ? '\u2665' : '\u2661', 12 + i * 18, 36);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = COL.spice;
  ctx.font = 'bold 18px "Courier New"';
  ctx.fillText('DEVOURED: ' + sr.score + '/' + sr.targetScore, W / 2, 18);

  // Progress bar
  ctx.fillStyle = '#333';
  ctx.fillRect(W / 2 - 100, 26, 200, 6);
  ctx.fillStyle = COL.spice;
  ctx.fillRect(W / 2 - 100, 26, 200 * Math.min(1, sr.score / sr.targetScore), 6);

  // Avoid rocks label
  ctx.textAlign = 'right';
  ctx.fillStyle = COL.text;
  ctx.font = '12px "Courier New"';
  ctx.fillText('AVOID ROCKS!', W - 10, 36);
  ctx.textAlign = 'left';

  // Instructions at start
  if (sr.timer < 180) {
    ctx.globalAlpha = Math.max(0, 1 - sr.timer / 180);
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.text;
    ctx.font = 'bold 16px "Courier New"';
    ctx.fillText('STEER INTO TROOPS TO DEVOUR \u2022 DODGE THE ROCKS', W / 2, H - 30);
    ctx.globalAlpha = 1;
  }

  // Victory overlay
  if (sr.phase === 'victory') {
    ctx.fillStyle = 'rgba(0, 0, 0, ' + Math.min(0.7, sr.victoryTimer / 60) + ')';
    ctx.fillRect(0, 0, W, H);

    if (sr.victoryTimer > 30) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 36px "Courier New"';
      ctx.fillText('SPICE SECURED', W / 2, H / 2 - 50);
      ctx.fillText('EN ROUTE TO ARRAKEEN', W / 2, H / 2 - 5);

      ctx.fillStyle = COL.spice;
      ctx.font = 'bold 18px "Courier New"';
      ctx.fillText('Paul and Chani ride the spice crawler.', W / 2, H / 2 + 35);

      ctx.fillStyle = COL.text;
      ctx.font = '16px "Courier New"';
      ctx.fillText('The battle for Arrakeen awaits...', W / 2, H / 2 + 65);

      if (sr.victoryTimer > 90 && Math.floor(sr.victoryTimer / 30) % 2 === 0) {
        ctx.fillStyle = COL.textBright;
        ctx.font = 'bold 16px "Courier New"';
        ctx.fillText('PRESS SPACE TO CONTINUE', W / 2, H / 2 + 110);
      }
    }
  }

  // Death overlay
  if (sr.phase === 'dead') {
    // Dark overlay fades in slowly after sinking starts
    const darkAlpha = Math.min(0.8, Math.max(0, (sr.victoryTimer - 60) / 80));
    ctx.fillStyle = 'rgba(0, 0, 0, ' + darkAlpha + ')';
    ctx.fillRect(0, 0, W, H);

    if (sr.victoryTimer > 90) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.harkonnen;
      ctx.font = 'bold 36px "Courier New"';
      ctx.fillText('SWALLOWED BY THE SAND', W / 2, H / 2 - 30);

      ctx.fillStyle = COL.text;
      ctx.font = '18px "Courier New"';
      ctx.fillText('Troops devoured: ' + sr.score, W / 2, H / 2 + 15);

      if (sr.victoryTimer > 140 && Math.floor(sr.victoryTimer / 30) % 2 === 0) {
        ctx.fillStyle = COL.text;
        ctx.font = 'bold 16px "Courier New"';
        ctx.fillText('PRESS SPACE', W / 2, H / 2 + 60);
      }
    }
  }

  ctx.restore();
}

// ============================================================
// THOPTER RAID LEVEL - vertical scrolling air-strike (three acts)
// Act 1: Paul strafes Harkonnen ground forces across the open desert.
// Act 2: He crosses into occupied Arrakeen, raked by rooftop flak.
// Act 3: A Harkonnen dreadnought rises to stop him — destroy it.
// ============================================================
let thopter = null;

const THOP_SPEED = 4.6;
const THOP_FIRE_RATE = 7;        // frames between lasgun shots
const THOP_BULLET_SPEED = 13;
const THOP_DESERT_END = 5200;    // open desert gives way to the city
const THOP_CITY_TRANS = 1100;    // crossfade distance desert -> city
const THOP_BOSS_DIST = 11000;    // reach the dreadnought (end of the run)
const THOP_TARGET_DIST = THOP_BOSS_DIST; // progress-bar denominator
const THOP_TOKEN_INTERVAL = 7;   // an upgrade token drops every N kills...
const THOP_MAX_WEAPON = 3;       // ...up to this lasgun level (1=single, 2=twin, 3=triple)

const THOP_ENEMY_DEFS = {
  turret:   { sprite: 'hark_turret',   w: 50, h: 54, hp: 3, fire: 'aimed',  rate: 95,  color: '#2a3550' },
  tank:     { sprite: 'hark_tank',     w: 50, h: 62, hp: 4, fire: 'aimed',  rate: 115, color: '#3a3242' },
  launcher: { sprite: 'hark_launcher', w: 42, h: 70, hp: 3, fire: 'spread', rate: 140, color: '#2c3346' },
  flak:     { sprite: 'hark_flak',     w: 54, h: 54, hp: 5, fire: 'burst',  rate: 105, color: '#3a3a44' },
};

function initThopter() {
  thopter = {
    px: W / 2 - 36, py: H - 110,
    pw: 72, ph: 50,
    hp: 5, maxHp: 5,
    invincible: 60,
    bullets: [],
    enemies: [],
    enemyBullets: [],
    particles: [],
    tokens: [],       // dropped lasgun-upgrade pickups
    features: [],     // decorative scrolling ground detail (desert)
    trail: [],
    weaponLevel: 1,   // lasgun power: 1=single, 2=twin, 3=triple-spread
    killCount: 0,
    nextTokenAt: THOP_TOKEN_INTERVAL,
    fireTimer: 0,
    spawnTimer: 240,   // clear flying before the first threats appear
    featureTimer: 0,
    scrollSpeed: 3,
    bgOffset: 0,
    distance: 0,
    score: 0,
    flap: 0,
    shakeAmount: 0,
    shakeDuration: 0,
    timer: 0,
    phase: 'flying',   // flying, boss_intro, boss, victory, dead
    act: 'desert',     // desert, city
    cityBlend: 0,      // 0 = pure desert, 1 = pure city
    banner: '',
    bannerTimer: 0,
    boss: null,
    victoryTimer: 0,
  };
  playMusic(musicThopter);
}

function thopBanner(text, frames) {
  thopter.banner = text;
  thopter.bannerTimer = frames;
}

function thopSpawnEnemy() {
  const t = thopter;
  let type;
  if (t.act === 'city') {
    const r = Math.random();
    type = r < 0.45 ? 'flak' : r < 0.65 ? 'tank' : r < 0.85 ? 'turret' : 'launcher';
  } else {
    const r = Math.random();
    type = r < 0.45 ? 'turret' : r < 0.80 ? 'tank' : 'launcher';
  }
  const def = THOP_ENEMY_DEFS[type];
  t.enemies.push({
    type,
    x: 40 + Math.random() * (W - 80 - def.w),
    y: -def.h - 10,
    w: def.w, h: def.h,
    hp: def.hp, maxHp: def.hp,
    fireTimer: 40 + Math.random() * def.rate,
    drift: type === 'tank' ? (Math.random() - 0.5) * 0.6 : 0,
    hitFlash: 0,
  });
}

function thopSpawnBoss() {
  const t = thopter;
  const w = 400, h = 210;
  t.boss = {
    cx: W / 2,
    y: -h - 30,          // top edge; descends into view during the intro
    w, h,
    hoverTop: 18,        // resting top-edge y
    hp: 96, maxHp: 96,
    vx: 1.1,
    phaseN: 1,
    attackTimer: 150,
    attackIx: 0,
    invulnerable: 0,
    hitFlash: 0,
    beam: null,          // { state:'charge'|'fire', timer, x }
    dead: false,
    deathTimer: 0,
    deathBlasts: 0,
    introTimer: 0,
  };
}

function updateThopParticles(t) {
  t.particles = t.particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; return p.life > 0; });
}

function thopHurtPlayer(t, x, y) {
  t.hp--;
  t.invincible = 75;
  t.shakeAmount = 9; t.shakeDuration = 14;
  sfx('thop_hit');
  for (let i = 0; i < 10; i++) t.particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 18, color: '#FF5533', size: 3 });
  if (t.hp <= 0) {
    t.phase = 'dead';
    t.victoryTimer = 0;
    sfx('plat_paul_die');
    stopMusic();
  } else if (t.weaponLevel > 1) {
    // Taking a hit knocks the lasgun down one tier — re-earn it over the next interval
    t.weaponLevel--;
    t.nextTokenAt = t.killCount + THOP_TOKEN_INTERVAL;
    thopBanner('LASGUN DAMAGED  ▼  LV ' + t.weaponLevel, 90);
  }
}

function updateThopter() {
  if (!thopter) return;
  const t = thopter;
  t.timer++;
  t.flap += 0.4;
  if (t.bannerTimer > 0) t.bannerTimer--;

  // ----- Victory (dreadnought destroyed) -----
  if (t.phase === 'victory') {
    t.victoryTimer++;
    t.bgOffset += t.scrollSpeed * 0.5;
    t.py -= 0.6;
    updateThopParticles(t);
    if (t.victoryTimer > 240 || (t.victoryTimer > 120 && wasPressed('Space'))) {
      thopter = null;
      initPlatformer();
      gameState = 'platformer';
    }
    return;
  }

  // ----- Dead -----
  if (t.phase === 'dead') {
    t.victoryTimer++;
    t.py += 1.5; t.bgOffset += t.scrollSpeed * 0.4;
    updateThopParticles(t);
    if (t.victoryTimer > 150 || wasPressed('Space')) {
      gameState = 'title';
      titleMusicStarted = false;
      stopMusic();
      thopter = null;
    }
    return;
  }

  if (t.invincible > 0) t.invincible--;

  // ----- Background scroll & act progression -----
  if (t.phase === 'flying') {
    const progress = t.distance / THOP_BOSS_DIST;
    t.scrollSpeed = 3 + progress * 1.7;
    t.bgOffset += t.scrollSpeed;
    t.distance += t.scrollSpeed;

    t.cityBlend = Math.max(0, Math.min(1, (t.distance - THOP_DESERT_END) / THOP_CITY_TRANS));
    if (t.act === 'desert' && t.distance >= THOP_DESERT_END) {
      t.act = 'city';
      thopBanner('APPROACHING ARRAKEEN', 150);
    }

    if (t.distance >= THOP_BOSS_DIST) {
      t.phase = 'boss_intro';
      t.enemyBullets = [];
      t.spawnTimer = 999999;
      thopSpawnBoss();
      thopBanner('WARNING — HARKONNEN DREADNOUGHT', 180);
      sfx('klaxon');
      t.shakeAmount = 6; t.shakeDuration = 20;
    }
  } else {
    // boss_intro / boss: keep the city drifting slowly underneath for life
    t.cityBlend = 1;
    t.bgOffset += 0.8;
  }

  // ----- Player movement -----
  let mvx = 0, mvy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) mvx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) mvx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) mvy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) mvy += 1;
  if (mvx && mvy) { mvx *= 0.707; mvy *= 0.707; }
  t.px += mvx * THOP_SPEED;
  t.py += mvy * THOP_SPEED;
  t.px = Math.max(8, Math.min(W - t.pw - 8, t.px));
  t.py = Math.max(H * 0.30, Math.min(H - t.ph - 8, t.py));

  // Engine trail
  if (t.timer % 2 === 0) {
    t.trail.push({ x: t.px + t.pw / 2 + (Math.random() - 0.5) * 14, y: t.py + t.ph - 6, life: 16, size: 3 + Math.random() * 3 });
  }
  t.trail = t.trail.filter(d => { d.y += 2.5; d.life--; return d.life > 0; });

  // ----- Lasgun fire (not during the boss reveal). Pattern scales with weaponLevel -----
  if (t.fireTimer > 0) t.fireTimer--;
  const firing = keys['Space'] || keys['KeyX'] || keys['KeyZ'] || keys['KeyJ'];
  if (firing && t.fireTimer <= 0 && t.phase !== 'boss_intro') {
    t.fireTimer = t.weaponLevel >= 3 ? THOP_FIRE_RATE - 1 : THOP_FIRE_RATE;
    const cx = t.px + t.pw / 2, my = t.py + 4;
    if (t.weaponLevel <= 1) {
      t.bullets.push({ x: cx - 2, y: my, w: 4, h: 18, vx: 0 });
    } else if (t.weaponLevel === 2) {
      t.bullets.push({ x: cx - 12, y: my, w: 4, h: 18, vx: 0 });
      t.bullets.push({ x: cx + 8, y: my, w: 4, h: 18, vx: 0 });
    } else {
      t.bullets.push({ x: cx - 2, y: my, w: 4, h: 18, vx: 0 });
      t.bullets.push({ x: cx - 14, y: my + 4, w: 4, h: 16, vx: -2.4 });
      t.bullets.push({ x: cx + 10, y: my + 4, w: 4, h: 16, vx: 2.4 });
    }
    sfx('lasgun');
  }
  t.bullets = t.bullets.filter(b => { b.y -= THOP_BULLET_SPEED; b.x += b.vx || 0; return b.y + b.h > -10 && b.x > -20 && b.x < W + 20; });

  // ----- Spawn ground enemies & ground features (flying act only) -----
  if (t.phase === 'flying') {
    const progress = t.distance / THOP_BOSS_DIST;
    const spawnRate = Math.max(26, 70 - Math.floor(progress * 46));
    t.spawnTimer--;
    if (t.spawnTimer <= 0) { t.spawnTimer = spawnRate; thopSpawnEnemy(); }

    if (t.cityBlend < 0.6) {
      t.featureTimer--;
      if (t.featureTimer <= 0) {
        t.featureTimer = 32 + Math.random() * 30;
        const spice = Math.random() < 0.4;
        t.features.push({ x: Math.random() * W, y: -40, r: spice ? 12 + Math.random() * 20 : 7 + Math.random() * 12, spice, rot: Math.random() * Math.PI });
      }
    }
  }
  t.features = t.features.filter(f => { f.y += t.scrollSpeed * 0.9; return f.y < H + 40; });

  // ----- Update ground enemies -----
  for (const e of t.enemies) {
    e.y += t.scrollSpeed;
    e.x += e.drift * t.scrollSpeed;
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.y > 0 && e.y < H * 0.82 && t.phase === 'flying') {
      e.fireTimer--;
      if (e.fireTimer <= 0) {
        const def = THOP_ENEMY_DEFS[e.type];
        e.fireTimer = def.rate;
        const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
        const pcx = t.px + t.pw / 2, pcy = t.py + t.ph / 2;
        const baseAng = Math.atan2(pcy - ey, pcx - ex);
        if (def.fire === 'spread') {
          for (let a = -1; a <= 1; a++) t.enemyBullets.push({ x: ex, y: ey, vx: Math.cos(baseAng + a * 0.32) * 3.4, vy: Math.sin(baseAng + a * 0.32) * 3.4, r: 5, rocket: true });
        } else if (def.fire === 'burst') {
          for (let n = 0; n < 3; n++) t.enemyBullets.push({ x: ex, y: ey, vx: Math.cos(baseAng) * (4.2 + n * 0.5), vy: Math.sin(baseAng) * (4.2 + n * 0.5), r: 4, flak: true });
        } else {
          t.enemyBullets.push({ x: ex, y: ey, vx: Math.cos(baseAng) * 3.4, vy: Math.sin(baseAng) * 3.4, r: 4 });
        }
        sfx('hit');
      }
    }
  }

  // ----- Boss logic -----
  if (t.boss) updateThopBoss(t);

  // ----- Player bullets vs ground enemies & boss -----
  for (const b of t.bullets) {
    let consumed = false;
    for (const e of t.enemies) {
      if (e.hp <= 0) continue;
      if (b.x + b.w > e.x && b.x < e.x + e.w && b.y < e.y + e.h && b.y + b.h > e.y) {
        e.hp--; e.hitFlash = 5;
        const ix = b.x + b.w / 2, iy = b.y;
        b.y = -999; consumed = true;
        for (let i = 0; i < 4; i++) t.particles.push({ x: ix, y: iy, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3 - 1, life: 12, color: '#6CF6FF', size: 2 });
        if (e.hp <= 0) {
          t.score++; sfx('thop_explode');
          t.shakeAmount = 4; t.shakeDuration = 5;
          const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
          for (let i = 0; i < 16; i++) t.particles.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7, life: 22 + Math.random() * 14, color: i % 2 ? '#FF8C2A' : '#FFD24A', size: 2 + Math.random() * 3 });
          // Milestone kills drop a lasgun-upgrade token (until max level)
          t.killCount++;
          if (t.weaponLevel < THOP_MAX_WEAPON && t.killCount >= t.nextTokenAt) {
            t.nextTokenAt += THOP_TOKEN_INTERVAL;
            t.tokens.push({ x: cx - 16, y: cy - 16, w: 32, h: 32, bob: Math.random() * Math.PI * 2 });
          }
        }
        break;
      }
    }
    if (consumed) continue;
    const bs = t.boss;
    if (bs && !bs.dead && bs.y > -bs.h) {
      const bx = bs.cx - bs.w / 2, by = bs.y, bw = bs.w, bh = bs.h * 0.9;
      if (b.x + b.w > bx && b.x < bx + bw && b.y < by + bh && b.y + b.h > by) {
        b.y = -999;
        if (t.phase === 'boss' && bs.invulnerable <= 0) {
          bs.hp--; bs.hitFlash = 3;
          for (let i = 0; i < 3; i++) t.particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2, life: 10, color: '#FFE08A', size: 2 });
          thopBossCheckPhase(t);
          if (bs.hp <= 0) thopBossDie(t);
        }
      }
    }
  }
  t.bullets = t.bullets.filter(b => b.y > -100);
  t.enemies = t.enemies.filter(e => e.hp > 0 && e.y < H + 80);

  // ----- Enemy/boss projectiles vs player -----
  t.enemyBullets = t.enemyBullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) return false;
    if (t.invincible <= 0) {
      const pcx = t.px + t.pw / 2, pcy = t.py + t.ph / 2;
      if (Math.abs(b.x - pcx) < t.pw * 0.32 + b.r && Math.abs(b.y - pcy) < t.ph * 0.36 + b.r) {
        thopHurtPlayer(t, pcx, pcy);
        return false;
      }
    }
    return true;
  });

  // ----- Sweeping beam vs player -----
  thopBeamCollide(t);

  // ----- Boss body contact -----
  if (t.boss && !t.boss.dead && t.phase === 'boss' && t.invincible <= 0) {
    const bs = t.boss, bx = bs.cx - bs.w / 2, by = bs.y, bw = bs.w, bh = bs.h * 0.85;
    if (t.px + t.pw > bx && t.px < bx + bw && t.py < by + bh && t.py + t.ph > by) {
      thopHurtPlayer(t, t.px + t.pw / 2, t.py);
    }
  }

  // ----- Lasgun-upgrade tokens: scroll with the world, collect on touch -----
  t.tokens = t.tokens.filter(tok => {
    tok.y += t.scrollSpeed;
    tok.bob += 0.15;
    if (tok.y > H + 50) return false; // missed it — scrolled off
    // Generous pickup overlap
    const pcx = t.px + t.pw / 2, pcy = t.py + t.ph / 2;
    const tcx = tok.x + tok.w / 2, tcy = tok.y + tok.h / 2;
    if (Math.abs(pcx - tcx) < t.pw * 0.5 + tok.w * 0.5 && Math.abs(pcy - tcy) < t.ph * 0.5 + tok.h * 0.5) {
      if (t.weaponLevel < THOP_MAX_WEAPON) t.weaponLevel++;
      playLasgunUpgradeVoice();
      thopBanner('LASGUN UPGRADE  ▲  LV ' + t.weaponLevel, 110);
      for (let i = 0; i < 18; i++) t.particles.push({ x: tcx, y: tcy, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7, life: 24 + Math.random() * 12, color: i % 2 ? '#6CF6FF' : '#EAFFFF', size: 2 + Math.random() * 3 });
      return false;
    }
    return true;
  });

  updateThopParticles(t);

  if (t.shakeDuration > 0) t.shakeDuration--;
  else t.shakeAmount = 0;
}

// ----- Boss: Harkonnen dreadnought -----
function updateThopBoss(t) {
  const b = t.boss;
  if (b.hitFlash > 0) b.hitFlash--;
  if (b.invulnerable > 0) b.invulnerable--;

  // Death sequence — chain of explosions, then victory
  if (b.dead) {
    b.deathTimer++;
    b.cx += Math.sin(b.deathTimer * 0.2) * 0.6;
    if (b.deathTimer % 9 === 0 && b.deathBlasts < 16) {
      b.deathBlasts++;
      const ex = b.cx - b.w / 2 + Math.random() * b.w;
      const ey = b.y + Math.random() * b.h * 0.8;
      sfx('boss_explode');
      t.shakeAmount = 10; t.shakeDuration = 12;
      for (let i = 0; i < 26; i++) t.particles.push({ x: ex, y: ey, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9, life: 26 + Math.random() * 20, color: i % 2 ? '#FF8C2A' : '#FFD24A', size: 2 + Math.random() * 4 });
    }
    if (b.deathTimer > 170) {
      t.phase = 'victory';
      t.victoryTimer = 0;
      t.boss = null;
      t.enemyBullets = [];
      playMusic(musicVictory);
    }
    return;
  }

  // Descend into position during the reveal
  if (t.phase === 'boss_intro') {
    b.introTimer++;
    b.y += (b.hoverTop - b.y) * 0.045;
    if (b.introTimer > 80 && Math.abs(b.y - b.hoverTop) < 4) {
      b.y = b.hoverTop;
      t.phase = 'boss';
      playMusic(musicBoss);
    }
    return;
  }

  // Hover drift across the top
  b.cx += b.vx;
  const margin = b.w / 2 - 40;
  if (b.cx < margin) { b.cx = margin; b.vx = Math.abs(b.vx); }
  if (b.cx > W - margin) { b.cx = W - margin; b.vx = -Math.abs(b.vx); }

  if (b.beam) thopUpdateBeam(t);

  if (!b.beam) {
    b.attackTimer--;
    if (b.attackTimer <= 0) thopBossAttack(t);
  }
}

function thopBossAttack(t) {
  const b = t.boss;
  const pcx = t.px + t.pw / 2, pcy = t.py + t.ph / 2;
  let pool;
  if (b.phaseN === 1) pool = ['cannon', 'missiles'];
  else if (b.phaseN === 2) pool = ['cannon', 'missiles', 'beam'];
  else pool = ['cannon', 'missiles', 'beam', 'strafe'];
  const atk = pool[b.attackIx % pool.length];
  b.attackIx++;
  const cd = b.phaseN === 1 ? 95 : b.phaseN === 2 ? 78 : 62;

  if (atk === 'cannon') {
    const n = 5;
    const gy = b.y + b.h * 0.7;
    for (let i = 0; i < n; i++) {
      const gx = b.cx - b.w / 2 + (i + 0.5) * (b.w / n);
      const ang = Math.atan2(pcy - gy, pcx - gx);
      const spd = 3.6 + b.phaseN * 0.3;
      t.enemyBullets.push({ x: gx, y: gy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 6, shell: true });
    }
    sfx('hit');
    b.attackTimer = cd;
  } else if (atk === 'missiles') {
    const n = 7;
    const gx = b.cx, gy = b.y + b.h * 0.8;
    for (let i = 0; i < n; i++) {
      const ang = Math.PI / 2 + (i - (n - 1) / 2) * 0.22;
      t.enemyBullets.push({ x: gx, y: gy, vx: Math.cos(ang) * 3.0, vy: Math.sin(ang) * 3.0, r: 5, rocket: true });
    }
    sfx('hit');
    b.attackTimer = cd + 10;
  } else if (atk === 'beam') {
    b.beam = { state: 'charge', timer: 70, x: pcx };
    sfx('beam_charge');
    b.attackTimer = cd + 40;
  } else { // strafe — a wall of bombs straight down
    const n = 9;
    for (let i = 0; i < n; i++) {
      const gx = b.cx - b.w / 2 + (i + 0.5) * (b.w / n) + (Math.random() - 0.5) * 12;
      t.enemyBullets.push({ x: gx, y: b.y + b.h * 0.75, vx: (Math.random() - 0.5) * 0.6, vy: 4.6, r: 5, shell: true });
    }
    sfx('hit');
    b.attackTimer = cd;
  }
}

function thopUpdateBeam(t) {
  const b = t.boss, bm = b.beam;
  bm.timer--;
  const pcx = t.px + t.pw / 2;
  if (bm.state === 'charge') {
    const d = pcx - bm.x;
    bm.x += Math.sign(d) * Math.min(1.2, Math.abs(d));
    if (bm.timer <= 0) { bm.state = 'fire'; bm.timer = 55; }
  } else {
    bm.x += Math.sign(pcx - bm.x) * 1.4; // slow sweep toward the player
    if (bm.timer <= 0) b.beam = null;
  }
}

function thopBeamCollide(t) {
  const b = t.boss;
  if (!b || !b.beam || b.beam.state !== 'fire' || t.invincible > 0) return;
  const halfW = 24;
  const beamTop = b.y + b.h * 0.5;
  const pcx = t.px + t.pw / 2, pcy = t.py + t.ph / 2;
  if (Math.abs(pcx - b.beam.x) < halfW + t.pw * 0.28 && pcy + t.ph * 0.3 > beamTop) {
    thopHurtPlayer(t, pcx, pcy);
  }
}

function thopBossCheckPhase(t) {
  const b = t.boss;
  const frac = b.hp / b.maxHp;
  const np = frac <= 0.33 ? 3 : frac <= 0.66 ? 2 : 1;
  if (np > b.phaseN) {
    b.phaseN = np;
    b.invulnerable = 24;
    b.hitFlash = 6;
    t.shakeAmount = 8; t.shakeDuration = 14;
    t.enemyBullets = [];
    b.beam = null;
    thopBanner('HULL BREACHED — IT FIGHTS HARDER', 110);
    sfx('boss_explode');
  }
}

function thopBossDie(t) {
  const b = t.boss;
  b.dead = true;
  b.deathTimer = 0;
  b.deathBlasts = 0;
  t.enemyBullets = [];
  b.beam = null;
  t.score += 25;
  stopMusic();
  sfx('boss_explode');
  t.shakeAmount = 14; t.shakeDuration = 20;
  thopBanner('DREADNOUGHT DESTROYED', 200);
}

// Seamless vertical scroll of a texture via mirror-tiling (no visible seam)
function thopDrawBgTexture(img, scroll, alpha) {
  if (!(img && img.complete && img.naturalWidth)) return false;
  const dw = W;
  const dh = W * img.naturalHeight / img.naturalWidth;
  ctx.globalAlpha = alpha;
  // Ground scrolls DOWNWARD as scroll increases — the thopter flies forward (up)
  const first = Math.floor(-scroll / dh) - 1;
  for (let i = first; ; i++) {
    const y = i * dh + scroll;
    if (y > H) break;
    const flip = ((i % 2) + 2) % 2 === 1;
    if (flip) {
      ctx.save();
      ctx.translate(0, y + dh + 1);
      ctx.scale(1, -1);
      ctx.drawImage(img, 0, 0, dw, dh + 1); // +1px bleed hides the mirror seam
      ctx.restore();
    } else {
      ctx.drawImage(img, 0, y, dw, dh + 1); // +1px bleed hides the mirror seam
    }
  }
  ctx.globalAlpha = 1;
  return true;
}

function thopDrawBeam(t) {
  const b = t.boss, bm = b.beam;
  const top = b.y + b.h * 0.5;
  if (bm.state === 'charge') {
    ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t.timer * 0.6);
    ctx.strokeStyle = '#FF4D4D'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bm.x, top); ctx.lineTo(bm.x, H); ctx.stroke();
    ctx.globalAlpha = 1;
    const r = 6 + (70 - bm.timer) / 70 * 14;
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.arc(bm.x, top, r, 0, Math.PI * 2); ctx.fill();
  } else {
    const halfW = 24;
    const grad = ctx.createLinearGradient(bm.x - halfW, 0, bm.x + halfW, 0);
    grad.addColorStop(0, 'rgba(255,40,40,0)');
    grad.addColorStop(0.5, 'rgba(255,90,90,0.92)');
    grad.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(bm.x - halfW, top, halfW * 2, H - top);
    ctx.globalAlpha = 0.85; ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(bm.x - 5, top, 10, H - top);
    ctx.globalAlpha = 1;
  }
}

function thopDrawBoss(t) {
  const b = t.boss;
  if (b.beam) thopDrawBeam(t);
  const img = spriteImages.hark_battleship;
  const x = b.cx - b.w / 2, y = b.y;
  ctx.save();
  if (b.hitFlash > 0) ctx.filter = 'brightness(1.8)';
  if (img && img.complete && img.naturalWidth) ctx.drawImage(img, x, y, b.w, b.h);
  else { ctx.fillStyle = '#2a2630'; ctx.fillRect(x, y, b.w, b.h); }
  ctx.filter = 'none';
  ctx.restore();
}

function drawThopter() {
  if (!thopter) return;
  const t = thopter;

  ctx.save();
  if (t.shakeAmount > 0 && t.phase !== 'victory') {
    ctx.translate((Math.random() - 0.5) * t.shakeAmount * 2, (Math.random() - 0.5) * t.shakeAmount * 2);
  }

  // --- Scrolling ground: desert crossfading into the occupied city ---
  const desertOk = thopDrawBgTexture(spriteImages.thopter_desert, t.bgOffset, 1);
  if (!desertOk) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#C9A06A'); g.addColorStop(1, '#D9B780');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (t.cityBlend > 0) thopDrawBgTexture(spriteImages.thopter_city, t.bgOffset, t.cityBlend);

  // Decorative ground features (desert; fade out as the city takes over)
  const featAlpha = 1 - t.cityBlend;
  if (featAlpha > 0.02) {
    for (const f of t.features) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      if (f.spice) {
        // spice stain — irregular rust-orange patch soaked into the sand
        ctx.globalAlpha = 0.55 * featAlpha; ctx.fillStyle = '#A85A18';
        ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.4 * featAlpha; ctx.fillStyle = '#CC7A24';
        ctx.beginPath(); ctx.ellipse(f.r * 0.15, -f.r * 0.1, f.r * 0.55, f.r * 0.34, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        // rock outcrop — dark basalt grounded with a soft cast shadow
        ctx.globalAlpha = 0.3 * featAlpha; ctx.fillStyle = '#2e2519';
        ctx.beginPath(); ctx.ellipse(f.r * 0.28, f.r * 0.32, f.r * 1.05, f.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = featAlpha; ctx.fillStyle = '#5c4d3a';
        ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r * 0.78, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#7d6a4e';
        ctx.beginPath(); ctx.ellipse(-f.r * 0.26, -f.r * 0.28, f.r * 0.55, f.r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // Engine trail
  for (const d of t.trail) {
    ctx.globalAlpha = (d.life / 16) * 0.5;
    ctx.fillStyle = '#E8C99A';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- Ground enemies ---
  for (const e of t.enemies) {
    const def = THOP_ENEMY_DEFS[e.type];
    const img = spriteImages[def.sprite];
    if (img && img.complete && img.naturalWidth) {
      if (e.hitFlash > 0) ctx.filter = 'brightness(2.2)';
      ctx.drawImage(img, e.x, e.y, e.w, e.h);
      ctx.filter = 'none';
    } else {
      ctx.fillStyle = def.color; ctx.fillRect(e.x, e.y, e.w, e.h);
    }
    if (e.maxHp > 1 && e.hp < e.maxHp && e.y > 0) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x, e.y - 6, e.w, 4);
      ctx.fillStyle = '#E74C3C'; ctx.fillRect(e.x, e.y - 6, e.w * (e.hp / e.maxHp), 4);
    }
  }

  // --- Boss ---
  if (t.boss) thopDrawBoss(t);

  // --- Enemy / boss projectiles ---
  for (const b of t.enemyBullets) {
    let col = '#FF4444';
    if (b.shell) col = '#FFC04A';
    else if (b.rocket) col = '#FF7A2A';
    else if (b.flak) col = '#FF5BE0';
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // --- Lasgun beams ---
  for (const b of t.bullets) {
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#6CF6FF';
    ctx.fillRect(b.x - 3, b.y, b.w + 6, b.h);
    ctx.globalAlpha = 1; ctx.fillStyle = '#EAFFFF';
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }

  // --- Lasgun-upgrade tokens (glowing, bobbing pickups) ---
  for (const tok of t.tokens) {
    const cx = tok.x + tok.w / 2, cy = tok.y + tok.h / 2 + Math.sin(tok.bob) * 3;
    const pulse = 0.55 + 0.45 * Math.sin(tok.bob * 1.6);
    // cyan glow halo
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = '#6CF6FF';
    ctx.beginPath(); ctx.arc(cx, cy, tok.w * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    const img = spriteImages.lasgun_token;
    const s = tok.w * (1 + 0.06 * Math.sin(tok.bob * 1.6));
    if (img && img.complete && img.naturalWidth) {
      ctx.drawImage(img, cx - s / 2, cy - s / 2, s, s);
    } else {
      ctx.fillStyle = '#1a6f8c'; ctx.fillRect(cx - tok.w / 2, cy - tok.h / 2, tok.w, tok.h);
      ctx.fillStyle = '#6CF6FF'; ctx.fillRect(cx - tok.w / 4, cy - tok.h / 4, tok.w / 2, tok.h / 2);
    }
  }
  ctx.globalAlpha = 1;

  // --- Player thopter ---
  if (t.phase !== 'dead' || Math.floor(t.victoryTimer / 4) % 2 === 0) {
    const blink = t.invincible > 0 && Math.floor(t.invincible / 4) % 2 === 0;
    if (!blink) {
      const img = spriteImages.thopter;
      const flapScale = 1 + Math.sin(t.flap) * 0.06;
      const dw = t.pw * flapScale, dh = t.ph;
      const dx = t.px + (t.pw - dw) / 2, dy = t.py;
      if (img && img.complete && img.naturalWidth) ctx.drawImage(img, dx, dy, dw, dh);
      else { ctx.fillStyle = '#9aa06a'; ctx.fillRect(t.px, t.py, t.pw, t.ph); }
    }
  }

  // --- Particles ---
  for (const p of t.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 22);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // --- HUD ---
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, 34);
  const hs = 18, hf = spriteImages.hud_heart, he = spriteImages.hud_heart_empty;
  for (let i = 0; i < t.maxHp; i++) {
    const hx = 8 + i * (hs + 2), hy = 8;
    const img = i < t.hp ? hf : he;
    if (img && img.complete) ctx.drawImage(img, hx, hy, hs, hs);
    else { ctx.fillStyle = i < t.hp ? COL.heart : COL.heartEmpty; ctx.fillRect(hx, hy, hs - 3, hs - 3); }
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = COL.textBright;
  ctx.font = 'bold 14px "Courier New"';
  ctx.fillText('DESTROYED: ' + t.score, W - 10, 22);
  // Lasgun level pips (cyan), to the right of the hearts
  const lgx = 8 + t.maxHp * (hs + 2) + 8;
  ctx.textAlign = 'left';
  ctx.font = 'bold 9px "Courier New"';
  ctx.fillStyle = '#9fdfe8';
  ctx.fillText('LAS', lgx, 21);
  for (let i = 0; i < THOP_MAX_WEAPON; i++) {
    ctx.fillStyle = i < t.weaponLevel ? '#6CF6FF' : 'rgba(120,160,170,0.35)';
    ctx.fillRect(lgx + 26 + i * 9, 9, 7, 7);
  }

  if (t.boss && (t.phase === 'boss' || t.phase === 'boss_intro')) {
    // Boss health bar
    const bw = 320, bx = W / 2 - bw / 2, by = 23;
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.text;
    ctx.font = '10px "Courier New"';
    ctx.fillText('HARKONNEN DREADNOUGHT', W / 2, 9);
    ctx.fillStyle = '#222'; ctx.fillRect(bx, by, bw, 9);
    const frac = Math.max(0, t.boss.hp / t.boss.maxHp);
    ctx.fillStyle = '#C0392B'; ctx.fillRect(bx, by, bw * frac, 9);
    ctx.strokeStyle = '#000'; ctx.strokeRect(bx, by, bw, 9);
    ctx.textAlign = 'left';
  } else {
    // Progress bar
    const pw = 180, px = W / 2 - pw / 2, py = 12;
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.text;
    ctx.font = '10px "Courier New"';
    ctx.fillText(t.act === 'city' ? 'ASSAULT ON ARRAKEEN' : 'CROSSING HARKONNEN AIRSPACE', W / 2, 9);
    ctx.fillStyle = '#222'; ctx.fillRect(px, py, pw, 8);
    ctx.fillStyle = COL.spice;
    ctx.fillRect(px, py, pw * Math.min(1, t.distance / THOP_BOSS_DIST), 8);
    ctx.strokeStyle = '#000'; ctx.strokeRect(px, py, pw, 8);
    ctx.textAlign = 'left';
  }

  // --- Banner (act transitions / boss callouts) ---
  if (t.bannerTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, t.bannerTimer / 25);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, H / 2 - 28, W, 48);
    ctx.fillStyle = COL.spice;
    ctx.font = 'bold 22px "Courier New"';
    ctx.fillText(t.banner, W / 2, H / 2 + 4);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // --- Overlays ---
  if (t.phase === 'victory') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.55, t.victoryTimer / 80) + ')';
    ctx.fillRect(0, 0, W, H);
    if (t.victoryTimer > 30) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 30px "Courier New"';
      ctx.fillText('DREADNOUGHT DESTROYED', W / 2, H / 2 - 16);
      ctx.fillStyle = COL.spice;
      ctx.font = '15px "Courier New"';
      ctx.fillText('Paul descends on Arrakeen.', W / 2, H / 2 + 14);
      if (t.victoryTimer > 110 && Math.floor(t.victoryTimer / 30) % 2 === 0) {
        ctx.fillStyle = COL.text; ctx.font = 'bold 14px "Courier New"';
        ctx.fillText('PRESS SPACE', W / 2, H / 2 + 50);
      }
      ctx.textAlign = 'left';
    }
  }
  if (t.phase === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.8, t.victoryTimer / 50) + ')';
    ctx.fillRect(0, 0, W, H);
    if (t.victoryTimer > 25) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.harkonnen;
      ctx.font = 'bold 30px "Courier New"';
      ctx.fillText('THOPTER DOWN', W / 2, H / 2 - 10);
      if (t.victoryTimer > 60 && Math.floor(t.victoryTimer / 30) % 2 === 0) {
        ctx.fillStyle = COL.text; ctx.font = 'bold 14px "Courier New"';
        ctx.fillText('PRESS SPACE', W / 2, H / 2 + 30);
      }
      ctx.textAlign = 'left';
    }
  }
}

// ============================================================
// PLATFORMER: BATTLE OF ARRAKEEN
// Paul storms Arrakeen city, fights Sardaukar & Harkonnen,
// defeats Feyd-Rautha, and enters the Emperor's ship.
// ============================================================
let platformer = null;

const PLAT_GRAVITY = 0.6;
const PLAT_JUMP = -11;
const PLAT_SPEED = 4;
const PLAT_ACCEL = 0.6;       // ground acceleration
const PLAT_DECEL = 0.45;      // ground friction/deceleration
const PLAT_AIR_ACCEL = 0.3;   // less air control
const PLAT_AIR_DECEL = 0.05;  // very low air friction
const PLAT_COYOTE = 6;        // coyote time frames
const PLAT_JUMP_BUF = 6;      // jump buffer frames
const PLAT_WORLD_W = 4800; // total level width

function initPlatformer() {
  platformer = {
    // Player
    px: 60, py: 300,
    pw: 36, ph: 48,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1, // 1=right, -1=left
    attacking: false,
    attackTimer: 0,
    attackActiveFrames: 0, // multi-frame hit window
    slashAngle: 0, // animated slash arc
    slashParticles: [], // spark particles for slash
    hp: 6, maxHp: 6,
    invincible: 0,
    // Movement physics
    coyoteTimer: 0,
    jumpBufferTimer: 0,
    jumpHeld: false,
    wasOnGround: false,
    squashX: 1, squashY: 1, // squash/stretch scale
    // Camera
    camX: 0,
    // World
    platforms: [],
    enemies: [],
    particles: [],
    pickups: [], // dropped hearts (water of life)
    // Boss
    boss: null,
    bossDefeated: false,
    // Imperial ship position (at end of level)
    shipX: PLAT_WORLD_W - 400,
    // Phase
    phase: 'playing', // playing, boss, victory, entering_ship
    timer: 0,
    victoryTimer: 0,
    shakeAmount: 0,
    shakeDuration: 0,
  };
  const p = platformer;

  // Build level platforms
  // Ground sections with gaps — ground=true marks floor platforms
  const groundY = H - 40;
  // Section 1: Start area
  addPlatform(p, 0, groundY, 600, 40, true);
  addPlatform(p, 100, 355, 120, 16);   // reachable from ground (~85px jump)
  addPlatform(p, 300, 275, 100, 16);   // reachable from first platform (~80px)
  addPlatform(p, 480, 355, 100, 16);   // reachable from ground

  // Section 2: City walls
  addPlatform(p, 680, groundY, 500, 40, true);
  addPlatform(p, 700, 355, 100, 16);   // reachable from ground
  addPlatform(p, 860, 270, 120, 16);   // reachable from prev (~85px)
  addPlatform(p, 1020, 355, 100, 16);  // reachable from ground
  addPlatform(p, 940, 185, 80, 16);    // reachable from 270 platform (~85px)

  // Section 3: Deep city
  addPlatform(p, 1250, groundY, 600, 40, true);
  addPlatform(p, 1280, 355, 120, 16);  // reachable from ground
  addPlatform(p, 1450, 270, 100, 16);  // reachable from prev
  addPlatform(p, 1600, 355, 120, 16);  // reachable from ground
  addPlatform(p, 1540, 185, 80, 16);   // reachable from 270
  addPlatform(p, 1720, 270, 80, 16);   // reachable from ground via 355

  // Section 4: Palace approach
  addPlatform(p, 1950, groundY, 800, 40, true);
  addPlatform(p, 2000, 355, 120, 16);  // reachable from ground
  addPlatform(p, 2100, 355, 80, 16);   // stepping stone
  addPlatform(p, 2180, 270, 140, 16);  // reachable from 355
  addPlatform(p, 2380, 185, 100, 16);  // reachable from 270
  addPlatform(p, 2530, 290, 120, 16);  // reachable from ground/270
  addPlatform(p, 2420, 355, 80, 16);   // stepping stone

  // Section 5: Palace interior stairs
  addPlatform(p, 2850, groundY, 600, 40, true);
  for (let i = 0; i < 5; i++) {
    addPlatform(p, 2900 + i * 100, groundY - 50 - i * 45, 80, 16); // ~45px steps, reachable
  }

  // Section 6: Final approach to the ship
  addPlatform(p, 3450, groundY, 1350, 40, true);
  addPlatform(p, 3550, 355, 100, 16);  // reachable from ground
  addPlatform(p, 3750, 275, 120, 16);  // reachable from 355
  addPlatform(p, 3950, 355, 100, 16);  // reachable from ground
  addPlatform(p, 4150, 230, 80, 16);   // reachable from 355 nearby

  // Enemies - Sardaukar and Harkonnen patrols
  const enemyDefs = [
    // Section 1 — ground + platforms
    { x: 350, y: groundY - 40, type: 'harkonnen' },
    { x: 150, y: 355 - 40, type: 'harkonnen' },     // on platform
    // Section 2 — city walls
    { x: 800, y: groundY - 40, type: 'harkonnen' },
    { x: 880, y: 270 - 40, type: 'sardaukar' },      // on platform
    { x: 1050, y: 355 - 40, type: 'harkonnen' },     // on platform
    // Section 3 — deep city
    { x: 1350, y: groundY - 40, type: 'harkonnen' },
    { x: 1470, y: 270 - 40, type: 'sardaukar' },     // on platform
    { x: 1620, y: 355 - 40, type: 'harkonnen' },     // on platform
    { x: 1750, y: groundY - 40, type: 'sardaukar' },
    // Section 4 — palace approach
    { x: 2050, y: groundY - 40, type: 'harkonnen' },
    { x: 2200, y: 270 - 40, type: 'sardaukar' },     // on platform
    { x: 2400, y: 185 - 40, type: 'sardaukar' },     // on high platform
    { x: 2550, y: 290 - 40, type: 'harkonnen' },     // on platform
    { x: 2650, y: groundY - 40, type: 'sardaukar' },
    // Section 5 — palace stairs
    { x: 2950, y: groundY - 40, type: 'sardaukar' },
    { x: 3100, y: groundY - 40, type: 'harkonnen' },
    { x: 3050, y: groundY - 140 - 40, type: 'sardaukar' }, // on stairs
    // Section 6 — final approach
    { x: 3550, y: groundY - 40, type: 'harkonnen' },
    { x: 3770, y: 275 - 40, type: 'sardaukar' },     // on platform
    { x: 3950, y: groundY - 40, type: 'sardaukar' },
    { x: 4170, y: 230 - 40, type: 'sardaukar' },     // on high platform
    { x: 4300, y: groundY - 40, type: 'sardaukar' },
  ];
  for (const ed of enemyDefs) {
    p.enemies.push({
      x: ed.x, y: ed.y, w: 32, h: 40,
      type: ed.type,
      hp: ed.type === 'sardaukar' ? 3 : 2,
      vx: 0, vy: 0,
      facing: -1,
      patrolDir: 1,
      patrolDist: 0,
      patrolMax: 60 + Math.random() * 60,
      invulnerable: 0,
      alive: true,
      deathTimer: 0,
    });
  }

  // Boss: Feyd-Rautha (spawns in throne room)
  p.boss = null; // created when entering throne room
  // Throne room state
  p.throneRoom = null;

  playMusic(musicPlatform);
}

function addPlatform(p, x, y, w, h, ground = false) {
  p.platforms.push({ x, y, w, h, ground });
}

function platCollides(x, y, w, h, plats) {
  for (const p of plats) {
    if (x + w > p.x && x < p.x + p.w && y + h > p.y && y < p.y + p.h) return p;
  }
  return null;
}

function updatePlatformer() {
  if (!platformer) return;
  const p = platformer;
  p.timer++;

  if (p.phase === 'entering_ship') {
    p.victoryTimer++;
    // Paul walks toward ship
    p.px += 1.5;
    // Fade and transition after walking
    if (p.victoryTimer > 180 || wasPressed('Space')) {
      gameState = 'victory';
      platformer = null;
      stopMusic();
    }
    return;
  }

  if (p.phase === 'victory') {
    p.victoryTimer++;
    if (p.victoryTimer > 120) {
      p.phase = 'entering_ship';
      p.victoryTimer = 0;
    }
    return;
  }

  // Throne room transition - fade to black then enter arena
  if (p.phase === 'throne_transition') {
    p.victoryTimer++;
    if (p.victoryTimer === 80) {
      initThroneRoom(p);
    }
    if (p.victoryTimer > 160) {
      p.phase = 'throne_room';
      p.victoryTimer = 0;
      // Feyd-Rautha is revealed — dramatic stinger, then the boss theme rises
      sfx('feyd_stinger');
      p.shakeAmount = 12; p.shakeDuration = 30;
      p.bossMusicDelay = 75; // frames after the stinger before the theme kicks in
    }
    return;
  }

  // Throne room update
  if (p.phase === 'throne_room' || p.phase === 'throne_victory' || (p.phase === 'dead' && p.throneRoom)) {
    updateThroneRoom(p);
    return;
  }

  // Invincibility
  if (p.invincible > 0) p.invincible--;

  // Input - acceleration-based movement
  let inputDir = 0;
  if (keys['ArrowRight'] || keys['KeyD']) { inputDir = 1; p.facing = 1; }
  if (keys['ArrowLeft'] || keys['KeyA']) { inputDir = -1; p.facing = -1; }

  // Acceleration / deceleration
  if (inputDir !== 0) {
    const accel = p.onGround ? PLAT_ACCEL : PLAT_AIR_ACCEL;
    p.vx += inputDir * accel;
    if (Math.abs(p.vx) > PLAT_SPEED) p.vx = inputDir * PLAT_SPEED;
  } else {
    const decel = p.onGround ? PLAT_DECEL : PLAT_AIR_DECEL;
    if (Math.abs(p.vx) < decel) p.vx = 0;
    else p.vx -= Math.sign(p.vx) * decel;
  }

  // Coyote time - track time since last on ground
  if (p.onGround) {
    p.coyoteTimer = PLAT_COYOTE;
  } else {
    if (p.coyoteTimer > 0) p.coyoteTimer--;
  }

  // Jump buffer - remember jump press (Up / W; Space is the weapon)
  if (wasPressed('ArrowUp') || wasPressed('KeyW')) {
    p.jumpBufferTimer = PLAT_JUMP_BUF;
    p.jumpHeld = true;
  }
  if (p.jumpBufferTimer > 0) p.jumpBufferTimer--;

  // Execute jump (coyote + buffer)
  if (p.jumpBufferTimer > 0 && p.coyoteTimer > 0) {
    p.vy = PLAT_JUMP;
    p.onGround = false;
    p.coyoteTimer = 0;
    p.jumpBufferTimer = 0;
    // Jump squash/stretch
    p.squashX = 0.8; p.squashY = 1.2;
  }

  // Variable jump height - release early for shorter hop
  if (!(keys['ArrowUp'] || keys['KeyW'])) {
    p.jumpHeld = false;
  }
  if (!p.jumpHeld && p.vy < PLAT_JUMP * 0.4) {
    p.vy *= 0.85; // cut upward velocity
  }

  // Attack (Space = crysknife; X / Z still work)
  if (wasPressed('Space') || wasPressed('KeyX') || wasPressed('KeyZ')) {
    p.attacking = true;
    p.attackTimer = 14;
    p.attackActiveFrames = 4; // multi-frame hit window
    p.slashAngle = -1.2; // start angle for sweep
    // Attack lunge
    p.vx += p.facing * 3;
    sfx('plat_slash');
  }
  if (p.attackTimer > 0) p.attackTimer--;
  else p.attacking = false;
  if (p.attackActiveFrames > 0) p.attackActiveFrames--;

  // Gravity
  p.vy += PLAT_GRAVITY;
  if (p.vy > 12) p.vy = 12;

  // Move X (vx already includes knockback from old p.vx code)
  p.px += p.vx;
  if (p.px < 0) p.px = 0;
  if (p.px > PLAT_WORLD_W - p.pw) p.px = PLAT_WORLD_W - p.pw;
  // X collision
  const xHit = platCollides(p.px, p.py, p.pw, p.ph, p.platforms);
  if (xHit) {
    if (p.vx > 0) p.px = xHit.x - p.pw;
    else if (p.vx < 0) p.px = xHit.x + xHit.w;
    p.vx = 0;
  }

  // Move Y
  p.wasOnGround = p.onGround;
  p.py += p.vy;
  p.onGround = false;
  const yHit = platCollides(p.px, p.py, p.pw, p.ph, p.platforms);
  if (yHit) {
    if (p.vy > 0) {
      p.py = yHit.y - p.ph;
      p.onGround = true;
      // Landing squash
      if (!p.wasOnGround && p.vy > 3) {
        p.squashX = 1.25; p.squashY = 0.75;
      }
    }
    else { p.py = yHit.y + yHit.h; }
    p.vy = 0;
  }

  // Squash/stretch lerp back to normal
  p.squashX += (1 - p.squashX) * 0.2;
  p.squashY += (1 - p.squashY) * 0.2;

  // Trigger throne room when player reaches the Imperial ship
  if (!p.throneRoom && p.px > p.shipX + 30 && p.phase === 'playing') {
    p.phase = 'throne_transition';
    p.victoryTimer = 0;
    p.vx = 0; p.vy = 0;
    return;
  }

  // Fall death (only trigger once)
  if (p.py > H + 50 && p.phase !== 'dead') {
    p.hp = 0;
    p.phase = 'dead';
    p.victoryTimer = 0;
    sfx('plat_fall_die');
    stopMusic();
  }

  // Camera follows player
  p.camX = Math.max(0, Math.min(PLAT_WORLD_W - W, p.px - W * 0.35));

  // Attack hitbox - multi-frame active window, wider
  if (p.attacking && p.attackActiveFrames > 0) {
    const atkX = p.facing === 1 ? p.px + p.pw : p.px - 38;
    const atkW = 38;
    const atkY = p.py + 5;
    const atkH = p.ph - 10;

    // Hit enemies
    for (const e of p.enemies) {
      if (!e.alive || e.invulnerable > 0) continue;
      if (atkX + atkW > e.x && atkX < e.x + e.w && atkY + atkH > e.y && atkY < e.y + e.h) {
        e.hp--;
        e.invulnerable = 15;
        sfx('plat_hit');
        // Screen shake on hit
        p.shakeAmount = 4; p.shakeDuration = 6;
        // Knockback
        e.vx = p.facing * 6;
        if (e.hp <= 0) {
          e.alive = false;
          e.deathTimer = 0;
          sfx('plat_enemy_die');
          for (let i = 0; i < 8; i++) {
            p.particles.push({
              x: e.x + e.w / 2, y: e.y + e.h / 2,
              vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
              life: 20, color: e.type === 'sardaukar' ? '#555' : '#8B0000', size: 3,
            });
          }
          // Chance to drop a heart (water of life) — pops out of the fallen foe
          if (Math.random() < 0.3) {
            p.pickups.push({
              x: e.x + e.w / 2 - 11, y: e.y + e.h / 2 - 11,
              w: 22, h: 22,
              vx: (Math.random() - 0.5) * 2, vy: -5,
              onGround: false,
              bob: 0,
            });
          }
        }
      }
    }

    // Hit boss
    if (p.boss && p.boss.phase === 'fighting' && p.boss.invulnerable <= 0) {
      const b = p.boss;
      if (atkX + atkW > b.x && atkX < b.x + b.w && atkY + atkH > b.y && atkY < b.y + b.h) {
        b.hp--;
        b.invulnerable = 20;
        sfx('plat_hit');
        // Screen shake on boss hit
        p.shakeAmount = 6; p.shakeDuration = 8;
        b.vx = p.facing * 4;
        if (b.hp <= 0) {
          b.phase = 'dead';
          p.bossDefeated = true;
          sfx('victory');
          p.phase = 'victory';
          p.victoryTimer = 0;
          for (let i = 0; i < 15; i++) {
            p.particles.push({
              x: b.x + b.w / 2, y: b.y + b.h / 2,
              vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
              life: 30, color: '#8B0000', size: 4,
            });
          }
        }
      }
    }
  }

  // Update enemies
  for (const e of p.enemies) {
    if (!e.alive) { e.deathTimer++; continue; }
    if (e.invulnerable > 0) e.invulnerable--;

    // Patrol
    e.x += e.patrolDir * 0.8;
    e.patrolDist += 0.8;
    if (e.patrolDist >= e.patrolMax) { e.patrolDir *= -1; e.patrolDist = 0; e.facing = e.patrolDir; }

    // Apply knockback
    e.x += e.vx;
    e.vx *= 0.85;

    // Gravity
    e.vy += PLAT_GRAVITY;
    e.y += e.vy;
    const eHit = platCollides(e.x, e.y, e.w, e.h, p.platforms);
    if (eHit) { e.y = eHit.y - e.h; e.vy = 0; }

    // Damage player on contact
    if (p.invincible <= 0) {
      if (p.px + p.pw > e.x && p.px < e.x + e.w && p.py + p.ph > e.y && p.py < e.y + e.h) {
        p.hp--;
        p.invincible = 60;
        sfx('plat_hurt');
        p.vx = (p.px < e.x ? -1 : 1) * 5;
        p.vy = -5;
        if (p.hp <= 0) {
          p.phase = 'dead';
          p.victoryTimer = 0;
          sfx('plat_paul_die');
          stopMusic();
        }
      }
    }
  }

  // Update slash particles
  p.slashParticles = (p.slashParticles || []).filter(sp => {
    sp.x += sp.vx; sp.y += sp.vy; sp.life--;
    return sp.life > 0;
  });

  // Particles
  p.particles = p.particles.filter(pt => {
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life--;
    return pt.life > 0;
  });

  // Heart pickups (water of life) — fall, settle, bob, and heal on touch
  p.pickups = p.pickups.filter(hp => {
    if (!hp.onGround) {
      hp.vy += PLAT_GRAVITY;
      hp.x += hp.vx;
      hp.y += hp.vy;
      hp.vx *= 0.92;
      const hit = platCollides(hp.x, hp.y, hp.w, hp.h, p.platforms);
      if (hit && hp.vy >= 0) { hp.y = hit.y - hp.h; hp.vy = 0; hp.vx = 0; hp.onGround = true; }
    } else {
      hp.bob++;
    }
    // Lost down a pit
    if (hp.y > H + 100) return false;
    // Collect only when Paul actually needs it, so a heart waits until he's hurt
    if (p.hp < p.maxHp &&
        p.px + p.pw > hp.x && p.px < hp.x + hp.w &&
        p.py + p.ph > hp.y && p.py < hp.y + hp.h) {
      p.hp = Math.min(p.maxHp, p.hp + 2);
      sfx('water_pickup');
      for (let i = 0; i < 10; i++) {
        p.particles.push({
          x: hp.x + hp.w / 2, y: hp.y + hp.h / 2,
          vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5 - 1,
          life: 25, color: COL.heart, size: 3,
        });
      }
      return false;
    }
    return true;
  });

  // Shake
  if (p.shakeDuration > 0) p.shakeDuration--;
  else p.shakeAmount = 0;

  // Dead phase
  if (p.phase === 'dead') {
    p.victoryTimer++;
    if (p.victoryTimer > 120 || wasPressed('Space')) {
      gameState = 'title';
      titleMusicStarted = false;
      stopMusic();
      platformer = null;
    }
  }
}

// ============================================================
// THRONE ROOM - Imperial Ship Boss Arena
// ============================================================
const THRONE_W = 640;
const THRONE_H = 480;
const THRONE_FLOOR_Y = 400;

function initThroneRoom(p) {
  const floorY = THRONE_FLOOR_Y;
  p.throneRoom = {
    platforms: [
      // Main floor
      { x: 0, y: floorY, w: THRONE_W, h: 80 },
      // Three elevated platforms
      { x: 80, y: 310, w: 100, h: 14 },
      { x: 270, y: 260, w: 100, h: 14 },
      { x: 460, y: 310, w: 100, h: 14 },
    ],
    spectators: [],
    phaseText: '',
    phaseTextTimer: 0,
    darkenTimer: 0,
    victoryStep: 0,
  };
  // Fully reset player for arena — ensure alive and safe
  p.px = 100; p.py = floorY - p.ph;
  p.vx = 0; p.vy = 0;
  p.onGround = true;
  p.hp = p.maxHp;
  p.invincible = 180;
  p.attacking = false;
  p.attackTimer = 0;
  p.attackActiveFrames = 0;
  p.phase = 'throne_transition'; // keep in transition until timer expires
  p.particles = [];
  p.slashParticles = [];
  // Create 3-phase boss
  p.boss = {
    x: 500, y: floorY - 56, w: 44, h: 56,
    hp: 12, maxHp: 12,
    vx: 0, vy: 0,
    facing: -1,
    invulnerable: 30,
    attacking: false,
    attackTimer: 0,
    attackCooldown: 90,
    phase: 'fighting',
    bossPhase: 1, // 1=Calculating, 2=Aggressive, 3=Desperate
    onGround: true,
    // Special attacks
    dashSlash: false,
    dashDir: 0,
    dashTimer: 0,
    jumpSlam: false,
    jumpSlamTimer: 0,
    shockwaves: [],
    comboCount: 0,
    phaseTransition: 0, // timer for phase transition pause
    flashTimer: 0,
  };
  // Generate spectators
  const tr = p.throneRoom;
  // Left tier
  for (let i = 0; i < 6; i++) {
    tr.spectators.push({ x: 10 + i * 16, y: 140 + i * 8, type: i === 0 ? 'beneGesserit' : 'noble' });
  }
  // Right tier
  for (let i = 0; i < 6; i++) {
    tr.spectators.push({ x: THRONE_W - 20 - i * 16, y: 140 + i * 8, type: i === 0 ? 'beneGesserit' : 'noble' });
  }
  // Emperor on throne
  tr.spectators.push({ x: THRONE_W / 2, y: 65, type: 'emperor' });
  // Phase intro text
  tr.phaseText = 'THE EMPEROR\'S THRONE ROOM';
  tr.phaseTextTimer = 90;
  // Fade the level theme to silence behind the black screen — the stinger
  // hits in the quiet when Feyd-Rautha is revealed, then the boss theme rises.
  fadeOutMusic();
}

function updateThroneRoom(p) {
  const tr = p.throneRoom;
  const b = p.boss;
  p.timer++;

  // Bring in the Feyd-Rautha boss theme a beat after the appearance stinger
  if (p.bossMusicDelay > 0) {
    p.bossMusicDelay--;
    if (p.bossMusicDelay === 0) playMusic(musicFeydBoss);
  }

  // Phase text timer
  if (tr.phaseTextTimer > 0) tr.phaseTextTimer--;

  // Victory sequence
  if (p.phase === 'throne_victory') {
    p.victoryTimer++;
    if (p.victoryTimer > 300 || (p.victoryTimer > 120 && wasPressed('Space'))) {
      // Into the coronation cinematic (victory music crossfades in there)
      gameState = 'coronation';
      coronationTimer = 0;
      platformer = null;
    }
    return;
  }

  // Dead
  if (p.phase === 'dead') {
    p.victoryTimer++;
    if (p.victoryTimer > 120 || wasPressed('Space')) {
      gameState = 'title';
      titleMusicStarted = false;
      stopMusic();
      platformer = null;
    }
    return;
  }

  // Invincibility
  if (p.invincible > 0) p.invincible--;

  // Player movement (reuse platformer physics but in throne room)
  let inputDir = 0;
  if (keys['ArrowRight'] || keys['KeyD']) { inputDir = 1; p.facing = 1; }
  if (keys['ArrowLeft'] || keys['KeyA']) { inputDir = -1; p.facing = -1; }
  if (inputDir !== 0) {
    const accel = p.onGround ? PLAT_ACCEL : PLAT_AIR_ACCEL;
    p.vx += inputDir * accel;
    if (Math.abs(p.vx) > PLAT_SPEED) p.vx = inputDir * PLAT_SPEED;
  } else {
    const decel = p.onGround ? PLAT_DECEL : PLAT_AIR_DECEL;
    if (Math.abs(p.vx) < decel) p.vx = 0;
    else p.vx -= Math.sign(p.vx) * decel;
  }
  // Coyote time
  if (p.onGround) p.coyoteTimer = PLAT_COYOTE;
  else if (p.coyoteTimer > 0) p.coyoteTimer--;
  // Jump buffer (Up / W; Space is the weapon)
  if (wasPressed('ArrowUp') || wasPressed('KeyW')) {
    p.jumpBufferTimer = PLAT_JUMP_BUF; p.jumpHeld = true;
  }
  if (p.jumpBufferTimer > 0) p.jumpBufferTimer--;
  if (p.jumpBufferTimer > 0 && p.coyoteTimer > 0) {
    p.vy = PLAT_JUMP; p.onGround = false;
    p.coyoteTimer = 0; p.jumpBufferTimer = 0;
    p.squashX = 0.8; p.squashY = 1.2;
  }
  if (!(keys['ArrowUp'] || keys['KeyW'])) p.jumpHeld = false;
  if (!p.jumpHeld && p.vy < PLAT_JUMP * 0.4) p.vy *= 0.85;

  // Attack (Space = crysknife; X / Z still work)
  if (wasPressed('Space') || wasPressed('KeyX') || wasPressed('KeyZ')) {
    p.attacking = true; p.attackTimer = 14; p.attackActiveFrames = 4;
    p.slashAngle = -1.2;
    p.vx += p.facing * 3;
    sfx('plat_slash');
  }
  if (p.attackTimer > 0) p.attackTimer--;
  else p.attacking = false;
  if (p.attackActiveFrames > 0) p.attackActiveFrames--;

  // Gravity
  p.vy += PLAT_GRAVITY;
  if (p.vy > 12) p.vy = 12;
  // Move X
  p.px += p.vx;
  if (p.px < 10) p.px = 10;
  if (p.px > THRONE_W - p.pw - 10) p.px = THRONE_W - p.pw - 10;
  const xHit = platCollides(p.px, p.py, p.pw, p.ph, tr.platforms);
  if (xHit) {
    if (p.vx > 0) p.px = xHit.x - p.pw;
    else if (p.vx < 0) p.px = xHit.x + xHit.w;
    p.vx = 0;
  }
  // Move Y
  p.wasOnGround = p.onGround;
  p.py += p.vy;
  p.onGround = false;
  const yHit = platCollides(p.px, p.py, p.pw, p.ph, tr.platforms);
  if (yHit) {
    if (p.vy > 0) {
      p.py = yHit.y - p.ph; p.onGround = true;
      if (!p.wasOnGround && p.vy > 3) { p.squashX = 1.25; p.squashY = 0.75; }
    } else { p.py = yHit.y + yHit.h; }
    p.vy = 0;
  }
  // Squash/stretch
  p.squashX += (1 - p.squashX) * 0.2;
  p.squashY += (1 - p.squashY) * 0.2;

  // Fall death (only trigger once)
  if (p.py > THRONE_H + 50 && p.phase !== 'dead') {
    p.hp = 0; p.phase = 'dead'; p.victoryTimer = 0;
    sfx('plat_fall_die'); stopMusic();
  }

  // Player attack hitting boss
  if (b && b.phase === 'fighting' && p.attacking && p.attackActiveFrames > 0 && b.invulnerable <= 0 && b.phaseTransition <= 0) {
    const atkX = p.facing === 1 ? p.px + p.pw : p.px - 38;
    const atkW = 38, atkY = p.py + 5, atkH = p.ph - 10;
    if (atkX + atkW > b.x && atkX < b.x + b.w && atkY + atkH > b.y && atkY < b.y + b.h) {
      b.hp--;
      b.invulnerable = 20;
      sfx('plat_hit');
      p.shakeAmount = 6; p.shakeDuration = 8;
      b.vx = p.facing * 5;
      // Spark particles
      for (let i = 0; i < 5; i++) {
        p.particles.push({
          x: b.x + b.w / 2, y: b.y + b.h / 3,
          vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 4 - 2,
          life: 15, color: '#FFD700', size: 2 + Math.random() * 2,
        });
      }
