      // Phase transitions
      const oldPhase = b.bossPhase;
      if (b.hp <= 4) b.bossPhase = 3;
      else if (b.hp <= 8) b.bossPhase = 2;
      if (b.bossPhase !== oldPhase) {
        b.phaseTransition = 60;
        b.invulnerable = 60;
        p.shakeAmount = 8; p.shakeDuration = 30;
        tr.darkenTimer = 60;
        if (b.bossPhase === 2) {
          tr.phaseText = 'FEYD GROWS AGGRESSIVE';
        } else if (b.bossPhase === 3) {
          tr.phaseText = 'FEYD IS DESPERATE';
        }
        tr.phaseTextTimer = 90;
      }
      // Boss death
      if (b.hp <= 0) {
        b.phase = 'dead';
        p.phase = 'throne_victory';
        p.victoryTimer = 0;
        sfx('victory');
        // No screen shake on the victory moment — keep it calm and triumphant
        p.shakeAmount = 0; p.shakeDuration = 0;
        for (let i = 0; i < 20; i++) {
          p.particles.push({
            x: b.x + b.w / 2, y: b.y + b.h / 2,
            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
            life: 40, color: i % 2 ? '#8B0000' : '#FFD700', size: 3 + Math.random() * 3,
          });
        }
      }
    }
  }

  // Boss AI - 3 phases
  if (b && b.phase === 'fighting') {
    if (b.invulnerable > 0) b.invulnerable--;
    if (b.flashTimer > 0) b.flashTimer--;
    if (b.phaseTransition > 0) {
      b.phaseTransition--;
      b.flashTimer = b.phaseTransition; // flash during transition
      return; // pause during transition
    }

    const dx = p.px - b.x;
    const dist = Math.abs(dx);
    b.facing = dx > 0 ? 1 : -1;

    // Speed scales with phase
    const baseSpeed = b.bossPhase === 3 ? 2.4 : b.bossPhase === 2 ? 1.8 : 1.3;

    // Dash slash (phase 2+)
    if (b.dashSlash) {
      b.dashTimer--;
      b.x += b.dashDir * 8;
      // Clamp
      if (b.x < 20) b.x = 20;
      if (b.x > THRONE_W - b.w - 20) b.x = THRONE_W - b.w - 20;
      // Damage player during dash
      if (p.invincible <= 0 && b.dashTimer > 5) {
        if (p.px + p.pw > b.x - 10 && p.px < b.x + b.w + 10 && p.py + p.ph > b.y && p.py < b.y + b.h) {
          throneHitPlayer(p, b);
        }
      }
      if (b.dashTimer <= 0) {
        b.dashSlash = false;
        b.attackCooldown = 40;
      }
      // Gravity during dash
      b.vy += PLAT_GRAVITY;
      b.y += b.vy;
      b.onGround = false;
      const bHit = platCollides(b.x, b.y, b.w, b.h, tr.platforms);
      if (bHit && b.vy >= 0) { b.y = bHit.y - b.h; b.vy = 0; b.onGround = true; }
      return;
    }

    // Jump slam (phase 2+)
    if (b.jumpSlam) {
      b.jumpSlamTimer--;
      if (b.jumpSlamTimer > 20) {
        // Rising
      } else if (b.onGround && b.jumpSlamTimer < 18) {
        // Landed - create shockwave
        b.jumpSlam = false;
        p.shakeAmount = 8; p.shakeDuration = 10;
        const swWidth = b.bossPhase === 3 ? 200 : 140;
        b.shockwaves.push(
          { x: b.x + b.w / 2, y: THRONE_FLOOR_Y, dir: -1, dist: 0, maxDist: swWidth, life: 20 },
          { x: b.x + b.w / 2, y: THRONE_FLOOR_Y, dir: 1, dist: 0, maxDist: swWidth, life: 20 }
        );
        b.attackCooldown = 50;
        // Particles
        for (let i = 0; i < 8; i++) {
          p.particles.push({
            x: b.x + b.w / 2 + (Math.random() - 0.5) * 40, y: THRONE_FLOOR_Y - 5,
            vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5,
            life: 15, color: '#888', size: 3,
          });
        }
      }
      b.vy += PLAT_GRAVITY * 1.5; // slam fast
      b.y += b.vy;
      b.onGround = false;
      const bHit = platCollides(b.x, b.y, b.w, b.h, tr.platforms);
      if (bHit && b.vy >= 0) { b.y = bHit.y - b.h; b.vy = 0; b.onGround = true; }
      return;
    }

    // Normal movement - chase player
    if (dist > 50) {
      b.x += b.facing * baseSpeed;
    }
    // Jump toward player if on different platform or to dodge
    if (b.onGround && ((Math.abs(dx) < 200 && Math.random() < 0.015) || (p.py < b.y - 60 && Math.random() < 0.03))) {
      b.vy = PLAT_JUMP * 0.85;
    }

    // Attack logic
    b.attackCooldown--;
    if (b.attackCooldown <= 0 && dist < 60) {
      // Melee slash
      b.attacking = true;
      b.attackTimer = 12;
      const cooldowns = [70, 50, 30];
      b.attackCooldown = cooldowns[b.bossPhase - 1];
      b.comboCount++;
      // Phase 3: rapid combos
      if (b.bossPhase === 3 && b.comboCount < 3) {
        b.attackCooldown = 22; // fast follow-up
      } else {
        b.comboCount = 0;
      }
      // Damage player
      if (p.invincible <= 0 && dist < 55 && Math.abs(p.py - b.y) < 45) {
        throneHitPlayer(p, b);
      }
    }
    // Initiate dash slash (phase 2+)
    if (b.bossPhase >= 2 && b.attackCooldown <= 0 && dist > 100 && dist < 300 && b.onGround && Math.random() < 0.015) {
      b.dashSlash = true;
      b.dashDir = b.facing;
      b.dashTimer = 25;
      b.attacking = true;
      b.attackTimer = 25;
      // Telegraph flash
      b.flashTimer = 10;
    }
    // Initiate jump slam (phase 2+)
    if (b.bossPhase >= 2 && b.attackCooldown <= 0 && b.onGround && Math.random() < 0.008) {
      b.jumpSlam = true;
      b.jumpSlamTimer = 30;
      b.vy = PLAT_JUMP * 1.2;
      // Jump toward player
      b.vx = Math.sign(dx) * 3;
    }

    if (b.attackTimer > 0) b.attackTimer--;
    else b.attacking = false;

    // Gravity
    b.vy += PLAT_GRAVITY;
    b.y += b.vy;
    b.x += b.vx;
    b.vx *= 0.9;
    b.onGround = false;
    const bHit = platCollides(b.x, b.y, b.w, b.h, tr.platforms);
    if (bHit && b.vy >= 0) { b.y = bHit.y - b.h; b.vy = 0; b.onGround = true; }
    // Clamp
    if (b.x < 10) b.x = 10;
    if (b.x > THRONE_W - b.w - 10) b.x = THRONE_W - b.w - 10;

    // Update shockwaves
    b.shockwaves = b.shockwaves.filter(sw => {
      sw.dist += 8;
      sw.life--;
      // Damage player if touching shockwave
      if (p.invincible <= 0 && p.onGround) {
        const swX = sw.x + sw.dir * sw.dist;
        if (Math.abs(p.px + p.pw / 2 - swX) < 30 && p.py + p.ph > THRONE_FLOOR_Y - 20) {
          throneHitPlayer(p, b);
        }
      }
      return sw.life > 0 && sw.dist < sw.maxDist;
    });

    // Boss contact damage
    if (p.invincible <= 0) {
      if (p.px + p.pw > b.x && p.px < b.x + b.w && p.py + p.ph > b.y && p.py < b.y + b.h) {
        throneHitPlayer(p, b);
      }
    }
  }

  // Slash particles
  p.slashParticles = (p.slashParticles || []).filter(sp => {
    sp.x += sp.vx; sp.y += sp.vy; sp.life--;
    return sp.life > 0;
  });
  // General particles
  p.particles = p.particles.filter(pt => {
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life--;
    return pt.life > 0;
  });
  // Shake
  if (p.shakeDuration > 0) p.shakeDuration--;
  else p.shakeAmount = 0;
  // Darken timer
  if (tr.darkenTimer > 0) tr.darkenTimer--;
}

function throneHitPlayer(p, b) {
  p.hp--;
  p.invincible = 90;
  sfx('plat_hurt');
  p.vy = -5;
  p.vx = (p.px < b.x ? -1 : 1) * 7;
  if (p.hp <= 0) {
    p.phase = 'dead';
    p.victoryTimer = 0;
    sfx('plat_paul_die');
    stopMusic();
  }
}

function drawThroneRoom(p) {
  const tr = p.throneRoom;
  const b = p.boss;
  ctx.save();

  // Shake — never shake on the death or victory screen
  if (p.shakeAmount > 0 && p.phase !== 'dead' && p.phase !== 'throne_victory') {
    ctx.translate((Math.random() - 0.5) * p.shakeAmount * 2, (Math.random() - 0.5) * p.shakeAmount * 2);
  }

  // Background - Imperial ship interior
  const bgGrad = ctx.createLinearGradient(0, 0, 0, THRONE_H);
  bgGrad.addColorStop(0, '#1a1209');
  bgGrad.addColorStop(0.3, '#2a1a0a');
  bgGrad.addColorStop(1, '#0a0604');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, THRONE_W, THRONE_H);

  // Wall panels
  ctx.fillStyle = '#1e1408';
  ctx.fillRect(0, 0, 20, THRONE_H);
  ctx.fillRect(THRONE_W - 20, 0, 20, THRONE_H);
  // Gold trim on walls
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(18, 0, 3, THRONE_H);
  ctx.fillRect(THRONE_W - 21, 0, 3, THRONE_H);

  // Spectator tiers - left and right
  for (const s of tr.spectators) {
    if (s.type === 'emperor') {
      // Emperor on golden throne
      ctx.fillStyle = '#DAA520';
      ctx.fillRect(s.x - 25, s.y - 10, 50, 45); // throne
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(s.x - 20, s.y - 15, 40, 8); // throne top
      // Emperor figure
      ctx.fillStyle = '#B8860B';
      ctx.fillRect(s.x - 8, s.y + 2, 16, 28);
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(s.x - 5, s.y - 2, 10, 10); // head/crown
    } else if (s.type === 'beneGesserit') {
      ctx.fillStyle = '#111';
      ctx.fillRect(s.x - 5, s.y, 10, 20);
      ctx.fillRect(s.x - 3, s.y - 5, 6, 7);
    } else {
      // Noble
      const colors = ['#556', '#665', '#545'];
      ctx.fillStyle = colors[Math.floor(s.x * 7) % 3];
      ctx.fillRect(s.x - 4, s.y, 8, 16);
    }
  }

  // Two tall pillars
  const pillarGrad1 = ctx.createLinearGradient(60, 80, 90, 80);
  pillarGrad1.addColorStop(0, '#8B7355');
  pillarGrad1.addColorStop(0.5, '#A08868');
  pillarGrad1.addColorStop(1, '#6B5642');
  ctx.fillStyle = pillarGrad1;
  ctx.fillRect(60, 80, 30, THRONE_FLOOR_Y - 80);
  ctx.fillRect(THRONE_W - 90, 80, 30, THRONE_FLOOR_Y - 80);
  // Pillar caps
  ctx.fillStyle = '#DAA520';
  ctx.fillRect(55, 75, 40, 10);
  ctx.fillRect(THRONE_W - 95, 75, 40, 10);

  // Spotlight effect on combat floor
  const spotGrad = ctx.createRadialGradient(THRONE_W / 2, THRONE_FLOOR_Y - 80, 20, THRONE_W / 2, THRONE_FLOOR_Y - 40, 250);
  spotGrad.addColorStop(0, 'rgba(255, 220, 150, 0.12)');
  spotGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = spotGrad;
  ctx.fillRect(0, 0, THRONE_W, THRONE_FLOOR_Y);

  // Platforms
  for (const pl of tr.platforms) {
    if (pl.h > 40) {
      // Main floor - metal
      const floorGrad = ctx.createLinearGradient(0, pl.y, 0, pl.y + 12);
      floorGrad.addColorStop(0, '#666');
      floorGrad.addColorStop(1, '#444');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      // Floor line details
      ctx.fillStyle = '#555';
      for (let fx = pl.x; fx < pl.x + pl.w; fx += 40) {
        ctx.fillRect(fx, pl.y, 1, 6);
      }
    } else {
      // Elevated platforms
      ctx.fillStyle = '#777';
      ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.fillStyle = '#999';
      ctx.fillRect(pl.x, pl.y, pl.w, 3);
      // Support struts
      ctx.fillStyle = '#555';
      ctx.fillRect(pl.x + 10, pl.y + pl.h, 4, THRONE_FLOOR_Y - pl.y - pl.h);
      ctx.fillRect(pl.x + pl.w - 14, pl.y + pl.h, 4, THRONE_FLOOR_Y - pl.y - pl.h);
    }
  }

  // Draw boss
  if (b && (b.phase === 'fighting' || (b.phase === 'dead' && p.victoryTimer < 40))) {
    if (b.invulnerable > 0 && Math.floor(p.timer / 3) % 2) { /* blink */ }
    else {
      ctx.save();
      ctx.globalAlpha = b.phase === 'dead' ? Math.max(0, 1 - p.victoryTimer / 40) : 1;
      // Phase 3 red tint
      if (b.bossPhase === 3 && b.phase !== 'dead') {
        ctx.shadowColor = '#F00';
        ctx.shadowBlur = 8 + Math.sin(p.timer * 0.2) * 4;
      }
      // Flash during phase transition
      if (b.flashTimer > 0 && Math.floor(p.timer / 2) % 2) {
        ctx.globalAlpha *= 0.4;
      }
      const feydImg = spriteImages.feyd_rautha;
      if (feydImg && feydImg.complete) {
        ctx.save();
        if (b.facing < 0) {
          ctx.translate(b.x + b.w, b.y);
          ctx.scale(-1, 1);
          ctx.drawImage(feydImg, 0, 0, b.w, b.h);
        } else {
          ctx.drawImage(feydImg, b.x, b.y, b.w, b.h);
        }
        ctx.restore();
      } else {
        // Fallback Feyd drawing
        ctx.fillStyle = b.bossPhase === 3 ? '#550000' : '#333';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        // Head
        ctx.fillStyle = '#ddd';
        ctx.fillRect(b.x + 12, b.y + 2, 20, 16);
        // Eyes
        ctx.fillStyle = '#00F';
        ctx.fillRect(b.x + 16, b.y + 8, 4, 3);
        ctx.fillRect(b.x + 24, b.y + 8, 4, 3);
      }
      // Boss attack slash visual
      if (b.attacking && b.attackTimer > 4) {
        ctx.strokeStyle = '#F44';
        ctx.lineWidth = 3;
        ctx.globalAlpha = b.attackTimer / 12;
        const bSlashX = b.facing === 1 ? b.x + b.w + 5 : b.x - 20;
        ctx.beginPath();
        ctx.arc(bSlashX + 10, b.y + b.h / 2, 20, -0.6, 0.6);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // Dash telegraph
      if (b.dashSlash && b.dashTimer > 18) {
        ctx.fillStyle = 'rgba(255, 100, 0, 0.3)';
        ctx.fillRect(b.x + (b.dashDir > 0 ? b.w : -200), b.y, 200, b.h);
      }
      ctx.restore();
    }
  }

  // Shockwaves
  if (b) {
    for (const sw of b.shockwaves) {
      const swX = sw.x + sw.dir * sw.dist;
      const alpha = sw.life / 20;
      ctx.fillStyle = `rgba(255, 150, 50, ${alpha * 0.5})`;
      ctx.fillRect(swX - 15, THRONE_FLOOR_Y - 20, 30, 20);
      ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.8})`;
      ctx.fillRect(swX - 8, THRONE_FLOOR_Y - 25, 16, 10);
    }
  }

  // Draw player
  if (p.phase !== 'dead' || p.victoryTimer < 30) {
    if (p.invincible <= 0 || Math.floor(p.timer / 4) % 2 === 0) {
      const paulImg = spriteImages.paul_side;
      const sx = p.squashX || 1, sy = p.squashY || 1;
      const cx = p.px + p.pw / 2, cy = p.py + p.ph;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(p.facing < 0 ? -sx : sx, sy);
      ctx.translate(-p.pw / 2, -p.ph);
      if (paulImg && paulImg.complete) {
        ctx.drawImage(paulImg, 0, 0, p.pw, p.ph);
      } else {
        ctx.fillStyle = COL.fremen;
        ctx.fillRect(0, 0, p.pw, p.ph);
      }
      ctx.restore();

      // Slash trail
      if (p.attacking) {
        const progress = 1 - p.attackTimer / 14;
        const slashCX = p.facing === 1 ? p.px + p.pw + 6 : p.px - 6;
        const slashCY = p.py + p.ph * 0.4;
        const radius = 24;
        const startAngle = p.facing === 1 ? -1.3 + progress * 1.8 : Math.PI + 1.3 - progress * 1.8;
        const endAngle = startAngle + (p.facing === 1 ? 0.8 : -0.8);
        ctx.save();
        ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 12;
        ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4;
        ctx.globalAlpha = (p.attackTimer / 14) * 0.6;
        ctx.beginPath();
        ctx.arc(slashCX, slashCY, radius + 4, startAngle, endAngle, p.facing < 0);
        ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3;
        ctx.globalAlpha = p.attackTimer / 14;
        ctx.beginPath();
        ctx.arc(slashCX, slashCY, radius, startAngle, endAngle, p.facing < 0);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Slash particles
      for (const sp of (p.slashParticles || [])) {
        ctx.globalAlpha = sp.life / 14;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // General particles
  for (const pt of p.particles) {
    ctx.globalAlpha = pt.life / 20;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD - Boss HP bar at top
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, 0, THRONE_W, 36);
  ctx.textAlign = 'center';
  if (b && b.phase === 'fighting') {
    // Boss name
    const phaseNames = ['', 'CALCULATING', 'AGGRESSIVE', 'DESPERATE'];
    ctx.fillStyle = b.bossPhase === 3 ? '#F44' : b.bossPhase === 2 ? '#FA0' : '#FFF';
    ctx.font = 'bold 12px "Courier New"';
    ctx.fillText('FEYD-RAUTHA \u2014 ' + phaseNames[b.bossPhase], THRONE_W / 2, 12);
    // HP bar
    ctx.fillStyle = '#333';
    ctx.fillRect(THRONE_W / 2 - 100, 18, 200, 10);
    const hpColor = b.bossPhase === 3 ? '#F22' : b.bossPhase === 2 ? '#F80' : '#F44';
    ctx.fillStyle = hpColor;
    ctx.fillRect(THRONE_W / 2 - 100, 18, 200 * (b.hp / b.maxHp), 10);
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.strokeRect(THRONE_W / 2 - 100, 18, 200, 10);
  }

  // Player hearts
  ctx.textAlign = 'left';
  for (let i = 0; i < p.maxHp / 2; i++) {
    const hx = 10 + i * 20, hy = 8;
    const filled = p.hp - i * 2;
    const heartFull = spriteImages.hud_heart;
    const heartEmpty = spriteImages.hud_heart_empty;
    const img = filled >= 2 ? heartFull : heartEmpty;
    if (img && img.complete) {
      ctx.drawImage(img, hx, hy, 16, 16);
    } else {
      ctx.fillStyle = filled >= 2 ? COL.heart : COL.heartEmpty;
      ctx.font = '14px "Courier New"';
      ctx.fillText(filled >= 2 ? '\u2665' : '\u2661', hx, hy + 12);
    }
  }

  // Phase transition darkening
  if (tr.darkenTimer > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${tr.darkenTimer / 100})`;
    ctx.fillRect(0, 0, THRONE_W, THRONE_H);
  }

  // Phase text display
  if (tr.phaseTextTimer > 0) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, tr.phaseTextTimer / 30);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 22px "Courier New"';
    ctx.fillText(tr.phaseText, THRONE_W / 2, THRONE_H / 2 - 60);
    ctx.globalAlpha = 1;
  }

  // Victory cinematic
  if (p.phase === 'throne_victory') {
    const t = p.victoryTimer;
    const fade = Math.min(0.7, t / 80);
    ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
    ctx.fillRect(0, 0, THRONE_W, THRONE_H);
    ctx.textAlign = 'center';

    if (t > 30) {
      ctx.globalAlpha = Math.min(1, (t - 30) / 30);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 28px "Courier New"';
      ctx.fillText('FEYD-RAUTHA HAS FALLEN', THRONE_W / 2, THRONE_H / 2 - 60);
      ctx.globalAlpha = 1;
    }
    if (t > 90) {
      ctx.globalAlpha = Math.min(1, (t - 90) / 30);
      ctx.fillStyle = COL.text;
      ctx.font = '16px "Courier New"';
      ctx.fillText('Paul walks to the center of the arena.', THRONE_W / 2, THRONE_H / 2 - 20);
      ctx.globalAlpha = 1;
    }
    if (t > 150) {
      ctx.globalAlpha = Math.min(1, (t - 150) / 30);
      ctx.fillStyle = COL.text;
      ctx.font = '16px "Courier New"';
      ctx.fillText('The spectators fall silent.', THRONE_W / 2, THRONE_H / 2 + 10);
      ctx.globalAlpha = 1;
    }
    if (t > 210) {
      ctx.globalAlpha = Math.min(1, (t - 210) / 30);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 18px "Courier New"';
      ctx.fillText('The Emperor kneels before', THRONE_W / 2, THRONE_H / 2 + 50);
      ctx.fillText('Paul Muad\'Dib.', THRONE_W / 2, THRONE_H / 2 + 74);
      ctx.globalAlpha = 1;
    }
    if (t > 270 && Math.floor(t / 30) % 2 === 0) {
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 14px "Courier New"';
      ctx.fillText('PRESS SPACE', THRONE_W / 2, THRONE_H / 2 + 120);
    }
    ctx.textAlign = 'left';
  }

  // Dead overlay
  if (p.phase === 'dead') {
    const fade = Math.min(0.85, p.victoryTimer / 40);
    ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
    ctx.fillRect(0, 0, THRONE_W, THRONE_H);
    drawDefeatedPaul(p.victoryTimer);
    if (p.victoryTimer > 30) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.harkonnen;
      ctx.font = 'bold 32px "Courier New"';
      ctx.fillText('FALLEN IN BATTLE', THRONE_W / 2, THRONE_H - 64);
      if (p.victoryTimer > 60 && Math.floor(p.victoryTimer / 30) % 2 === 0) {
        ctx.fillStyle = COL.text;
        ctx.font = 'bold 16px "Courier New"';
        ctx.fillText('PRESS SPACE', THRONE_W / 2, THRONE_H - 32);
      }
      ctx.textAlign = 'left';
    }
  }

  ctx.restore();
}

// Defeated-Paul portrait shown on the death screen. Drawn without any shake.
function drawDefeatedPaul(vt) {
  const img = spriteImages.paul_defeated;
  if (!img || !img.complete || !img.naturalWidth) return;
  ctx.globalAlpha = Math.min(1, Math.max(0, (vt - 10) / 45));
  const size = 300;
  ctx.drawImage(img, W / 2 - size / 2, H / 2 - size / 2 - 45, size, size);
  ctx.globalAlpha = 1;
}

function drawPlatformer() {
  if (!platformer) return;
  const p = platformer;

  // Throne room transition - fade to black
  if (p.phase === 'throne_transition') {
    ctx.save();
    // Draw the existing level fading out
    const fadeOut = Math.min(1, p.victoryTimer / 60);
    ctx.globalAlpha = 1 - fadeOut;
    drawPlatformerLevel(p);
    ctx.globalAlpha = 1;
    // Black overlay
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, (p.victoryTimer - 40) / 40);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    // Text during transition
    if (p.victoryTimer > 60 && p.victoryTimer < 140) {
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, (p.victoryTimer - 60) / 20) * Math.min(1, (140 - p.victoryTimer) / 20);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 24px "Courier New"';
      ctx.fillText('ENTERING THE IMPERIAL SHIP', W / 2, H / 2 - 15);
      ctx.fillStyle = COL.text;
      ctx.font = '14px "Courier New"';
      ctx.fillText('Feyd-Rautha awaits...', W / 2, H / 2 + 15);
      ctx.textAlign = 'left';
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // Throne room
  if (p.phase === 'throne_room' || p.phase === 'throne_victory' || (p.phase === 'dead' && p.throneRoom)) {
    drawThroneRoom(p);
    return;
  }

  drawPlatformerLevel(p);
}

function drawPlatformerLevel(p) {
  ctx.save();

  // Shake — never shake on the death screen
  if (p.shakeAmount > 0 && p.phase !== 'dead') {
    ctx.translate((Math.random() - 0.5) * p.shakeAmount * 2, (Math.random() - 0.5) * p.shakeAmount * 2);
  }

  // Parallax background
  const bgImg = spriteImages.arrakeen_bg;
  if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
    const bgParallax = p.camX * 0.3;
    ctx.drawImage(bgImg, -bgParallax % W, 0, W, H);
    ctx.drawImage(bgImg, (-bgParallax % W) + W, 0, W, H);
  } else {
    // Fallback sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#2a1000');
    skyGrad.addColorStop(0.5, '#8B4000');
    skyGrad.addColorStop(1, '#EDC9AF');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.save();
  ctx.translate(-p.camX, 0);

  // Draw platforms (ground uses sand texture, elevated uses stone)
  const platImg = spriteImages.stone_platform;
  const groundImg = spriteImages.ground_platform;
  for (const pl of p.platforms) {
    if (pl.x + pl.w < p.camX - 50 || pl.x > p.camX + W + 50) continue;
    const img = pl.ground ? groundImg : platImg;
    if (img && img.complete) {
      const tileW = pl.ground ? 160 : 80;
      for (let tx = pl.x; tx < pl.x + pl.w; tx += tileW) {
        const tw = Math.min(tileW, pl.x + pl.w - tx);
        ctx.drawImage(img, 0, 0, img.naturalWidth * (tw / tileW), img.naturalHeight, tx, pl.y, tw, pl.h);
      }
    } else {
      ctx.fillStyle = pl.ground ? '#8B7355' : '#6B5642';
      ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.fillStyle = pl.ground ? '#A08060' : '#5A4A38';
      ctx.fillRect(pl.x, pl.y, pl.w, 3);
    }
  }

  // Draw Imperial Ship at end of level
  const shipImg = spriteImages.imperial_ship;
  if (shipImg && shipImg.complete) {
    ctx.drawImage(shipImg, p.shipX, H - 280, 350, 240);
  } else {
    ctx.fillStyle = '#B8860B';
    ctx.fillRect(p.shipX, H - 250, 300, 210);
    ctx.fillStyle = '#DAA520';
    ctx.fillRect(p.shipX + 50, H - 280, 200, 40);
  }

  // Draw enemies
  for (const e of p.enemies) {
    if (e.x + e.w < p.camX - 50 || e.x > p.camX + W + 50) continue;
    if (!e.alive) {
      if (e.deathTimer < 20) {
        ctx.globalAlpha = 1 - e.deathTimer / 20;
        const sprKey = e.type === 'sardaukar' ? 'sardaukar' : 'harkonnen';
        if (spriteImages[sprKey] && spriteImages[sprKey].complete) {
          ctx.drawImage(spriteImages[sprKey], e.x, e.y, e.w, e.h);
        }
        ctx.globalAlpha = 1;
      }
      continue;
    }
    if (e.invulnerable > 0 && Math.floor(p.timer / 3) % 2) continue;
    const sprKey = e.type === 'sardaukar' ? 'sardaukar' : 'harkonnen';
    if (spriteImages[sprKey] && spriteImages[sprKey].complete) {
      ctx.save();
      if (e.facing < 0) {
        ctx.translate(e.x + e.w, e.y);
        ctx.scale(-1, 1);
        ctx.drawImage(spriteImages[sprKey], 0, 0, e.w, e.h);
      } else {
        ctx.drawImage(spriteImages[sprKey], e.x, e.y, e.w, e.h);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = e.type === 'sardaukar' ? '#555' : COL.harkonnen;
      ctx.fillRect(e.x, e.y, e.w, e.h);
    }
    // HP bar
    if (e.hp < (e.type === 'sardaukar' ? 3 : 2)) {
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x, e.y - 6, e.w, 4);
      ctx.fillStyle = '#E44';
      ctx.fillRect(e.x, e.y - 6, e.w * (e.hp / (e.type === 'sardaukar' ? 3 : 2)), 4);
    }
  }

  // Draw boss
  if (p.boss && p.boss.phase !== 'waiting') {
    const b = p.boss;
    if (b.invulnerable > 0 && Math.floor(p.timer / 3) % 2) { /* blink */ }
    else if (b.phase !== 'dead' || (b.phase === 'dead' && p.victoryTimer < 30)) {
      const feydImg = spriteImages.feyd_rautha;
      ctx.globalAlpha = b.phase === 'dead' ? Math.max(0, 1 - p.victoryTimer / 30) : 1;
      if (feydImg && feydImg.complete) {
        ctx.save();
        if (b.facing < 0) {
          ctx.translate(b.x + b.w, b.y);
          ctx.scale(-1, 1);
          ctx.drawImage(feydImg, 0, 0, b.w, b.h);
        } else {
          ctx.drawImage(feydImg, b.x, b.y, b.w, b.h);
        }
        ctx.restore();
      } else {
        ctx.fillStyle = '#333';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
      ctx.globalAlpha = 1;
      // Boss HP bar
      if (b.phase === 'fighting') {
        ctx.fillStyle = '#333';
        ctx.fillRect(b.x - 10, b.y - 12, b.w + 20, 6);
        ctx.fillStyle = '#F44';
        ctx.fillRect(b.x - 10, b.y - 12, (b.w + 20) * (b.hp / b.maxHp), 6);
        ctx.fillStyle = COL.textBright;
        ctx.font = 'bold 10px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('FEYD-RAUTHA', b.x + b.w / 2, b.y - 16);
        ctx.textAlign = 'left';
      }
    }
  }

  // Draw player with squash/stretch
  if (p.phase !== 'dead' || p.victoryTimer < 30) {
    if (p.invincible <= 0 || Math.floor(p.timer / 4) % 2 === 0) {
      const paulImg = spriteImages.paul_side;
      const sx = p.squashX || 1, sy = p.squashY || 1;
      const cx = p.px + p.pw / 2, cy = p.py + p.ph; // bottom-center pivot
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(p.facing < 0 ? -sx : sx, sy);
      ctx.translate(-p.pw / 2, -p.ph);
      if (paulImg && paulImg.complete) {
        ctx.drawImage(paulImg, 0, 0, p.pw, p.ph);
      } else {
        ctx.fillStyle = COL.fremen;
        ctx.fillRect(0, 0, p.pw, p.ph);
      }
      ctx.restore();

      // Crysknife slash trail - animated arc sweep with glow
      if (p.attacking) {
        const progress = 1 - p.attackTimer / 14;
        const slashCX = p.facing === 1 ? p.px + p.pw + 6 : p.px - 6;
        const slashCY = p.py + p.ph * 0.4;
        const radius = 24;
        // Sweep from top to bottom
        const startAngle = p.facing === 1 ? -1.3 + progress * 1.8 : Math.PI + 1.3 - progress * 1.8;
        const endAngle = startAngle + (p.facing === 1 ? 0.8 : -0.8);

        // Outer glow
        ctx.save();
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 4;
        ctx.globalAlpha = (p.attackTimer / 14) * 0.6;
        ctx.beginPath();
        ctx.arc(slashCX, slashCY, radius + 4, startAngle, endAngle, p.facing < 0);
        ctx.stroke();
        ctx.restore();

        // Main blade arc
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 3;
        ctx.globalAlpha = p.attackTimer / 14;
        ctx.beginPath();
        ctx.arc(slashCX, slashCY, radius, startAngle, endAngle, p.facing < 0);
        ctx.stroke();

        // Inner bright arc
        ctx.strokeStyle = '#FFFAE0';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(slashCX, slashCY, radius - 4, startAngle, endAngle, p.facing < 0);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Spawn spark particles during active frames
        if (p.attackActiveFrames > 0 && p.timer % 2 === 0) {
          const sparkAngle = (startAngle + endAngle) / 2;
          for (let i = 0; i < 2; i++) {
            (p.slashParticles = p.slashParticles || []).push({
              x: slashCX + Math.cos(sparkAngle) * radius,
              y: slashCY + Math.sin(sparkAngle) * radius,
              vx: (Math.random() - 0.5) * 3 + p.facing * 2,
              vy: (Math.random() - 0.5) * 3,
              life: 8 + Math.random() * 6,
              color: Math.random() > 0.5 ? '#FFD700' : '#FFF',
              size: 1.5 + Math.random() * 1.5,
            });
          }
        }
      }

      // Draw slash spark particles
      for (const sp of (p.slashParticles || [])) {
        ctx.globalAlpha = sp.life / 14;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Heart pickups (water of life)
  const heartSprite = spriteImages.item_heart;
  for (const hp of p.pickups) {
    const bobY = hp.onGround ? Math.sin(hp.bob * 0.1) * 4 : 0;
    const cx = hp.x + hp.w / 2;
    const cy = hp.y + hp.h / 2 + bobY;
    // Soft pulsing glow so it reads as a pickup
    const pulse = 0.5 + 0.5 * Math.sin(hp.bob * 0.12);
    ctx.save();
    ctx.globalAlpha = 0.25 + pulse * 0.25;
    ctx.fillStyle = COL.heart;
    ctx.beginPath();
    ctx.arc(cx, cy, hp.w * 0.75, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (heartSprite && heartSprite.complete) {
      ctx.drawImage(heartSprite, hp.x, hp.y + bobY, hp.w, hp.h);
    } else {
      drawHeart(hp.x, hp.y + bobY, hp.w, COL.heart);
    }
  }

  // Particles
  for (const pt of p.particles) {
    ctx.globalAlpha = pt.life / 20;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore(); // end camera translate

  // HUD
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(0, 0, W, 36);

  ctx.textAlign = 'left';
  ctx.fillStyle = COL.textBright;
  ctx.font = 'bold 14px "Courier New"';
  ctx.fillText('BATTLE OF ARRAKEEN', 10, 15);

  // Hearts
  const heartFull = spriteImages.hud_heart;
  const heartEmpty = spriteImages.hud_heart_empty;
  for (let i = 0; i < p.maxHp / 2; i++) {
    const hx = 10 + i * 20;
    const hy = 20;
    const filled = p.hp - i * 2;
    const img = filled >= 2 ? heartFull : heartEmpty;
    if (img && img.complete) {
      ctx.drawImage(img, hx, hy, 16, 16);
    } else {
      ctx.fillStyle = filled >= 2 ? COL.heart : COL.heartEmpty;
      ctx.fillText(filled >= 2 ? '\u2665' : '\u2661', hx, hy + 12);
    }
  }

  // Progress bar (distance through level)
  const progress = p.px / PLAT_WORLD_W;
  ctx.fillStyle = '#333';
  ctx.fillRect(W / 2 - 80, 22, 160, 8);
  ctx.fillStyle = COL.spice;
  ctx.fillRect(W / 2 - 80, 22, 160 * progress, 8);
  ctx.fillStyle = COL.text;
  ctx.font = '10px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText('ARRAKEEN', W / 2, 18);

  // Boss name when fighting
  if (p.boss && p.boss.phase === 'fighting') {
    ctx.fillStyle = '#F44';
    ctx.font = 'bold 14px "Courier New"';
    ctx.textAlign = 'right';
    ctx.fillText('FEYD-RAUTHA', W - 10, 15);
    ctx.fillStyle = '#333';
    ctx.fillRect(W - 120, 20, 110, 8);
    ctx.fillStyle = '#F44';
    ctx.fillRect(W - 120, 20, 110 * (p.boss.hp / p.boss.maxHp), 8);
  }

  ctx.textAlign = 'left';

  // Control reminder at the start of the run (fades out)
  if (p.phase === 'playing' && p.timer < 240) {
    const a = p.timer < 180 ? 1 : (240 - p.timer) / 60;
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.textBright;
    ctx.font = 'bold 16px "Courier New"';
    ctx.fillText('↑ / W  Jump      SPACE  Crysknife      ← →  Move', W / 2, H - 24);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // Victory overlay
  if (p.phase === 'victory') {
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.textBright;
    ctx.font = 'bold 28px "Courier New"';
    ctx.fillText('FEYD-RAUTHA DEFEATED', W / 2, H / 2 - 20);
    ctx.fillStyle = COL.text;
    ctx.font = '16px "Courier New"';
    ctx.fillText('The Emperor awaits...', W / 2, H / 2 + 15);
    ctx.textAlign = 'left';
  }

  // Entering ship overlay
  if (p.phase === 'entering_ship') {
    const fade = Math.min(1, p.victoryTimer / 120);
    ctx.fillStyle = 'rgba(0, 0, 0, ' + fade * 0.7 + ')';
    ctx.fillRect(0, 0, W, H);
    if (p.victoryTimer > 40) {
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, (p.victoryTimer - 40) / 40);
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 28px "Courier New"';
      ctx.fillText('PAUL ENTERS THE', W / 2, H / 2 - 30);
      ctx.fillText('IMPERIAL SHIP', W / 2, H / 2 + 10);
      ctx.fillStyle = COL.spice;
      ctx.font = 'italic 16px "Courier New"';
      ctx.fillText('"I am the Kwisatz Haderach."', W / 2, H / 2 + 50);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  // Dead overlay
  if (p.phase === 'dead') {
    const fade = Math.min(0.85, p.victoryTimer / 40);
    ctx.fillStyle = 'rgba(0, 0, 0, ' + fade + ')';
    ctx.fillRect(0, 0, W, H);
    drawDefeatedPaul(p.victoryTimer);
    if (p.victoryTimer > 30) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.harkonnen;
      ctx.font = 'bold 32px "Courier New"';
      ctx.fillText('FALLEN IN BATTLE', W / 2, H - 64);
      if (p.victoryTimer > 60 && Math.floor(p.victoryTimer / 30) % 2 === 0) {
        ctx.fillStyle = COL.text;
        ctx.font = 'bold 16px "Courier New"';
        ctx.fillText('PRESS SPACE', W / 2, H - 32);
      }
      ctx.textAlign = 'left';
    }
  }

  ctx.restore();
}

// WORM CAPTURE TRANSITION SCREEN
// ============================================================
let wormCapturedTimer = 0;
// time = frame the line (and its voice-over) starts; spaced to each clip's length
const captureLines = [
  { text: 'Paul plants the maker hooks...', time: 60 },
  { text: 'Shai-Hulud writhes and roars!', time: 185 },
  { text: 'The great worm submits.', time: 345 },
  { text: 'Paul Muad\'Dib is now a Sandrider.', time: 475 },
  { text: '"The desert is my domain."', time: 640 },
  { text: 'Destroy the Harkonnen patrol.', time: 770 },
  { text: 'Find the spice harvester.', time: 905 },
];

function drawWormCaptured() {
  const t = wormCapturedTimer;

  // Background image with fade in
  const bgImg = spriteImages.transition_capture;
  if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
    const fadeIn = Math.min(1, t / 60);
    ctx.globalAlpha = fadeIn;
    // Slow zoom effect
    const zoom = 1 + t * 0.0003;
    const zw = W * zoom;
    const zh = H * zoom;
    ctx.drawImage(bgImg, (W - zw) / 2, (H - zh) / 2, zw, zh);
    // Dark overlay for text readability
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = '#1a0a00';
    ctx.fillRect(0, 0, W, H);
  }

  // Spice particles floating
  for (let i = 0; i < 25; i++) {
    const px = (i * 97 + t * 0.4 + i * i * 13) % W;
    const py = (i * 61 + t * 0.25 + i * 7) % H;
    const bright = Math.sin(t * 0.04 + i * 2) * 0.3 + 0.5;
    ctx.globalAlpha = bright * 0.5;
    ctx.fillStyle = COL.spiceGlow;
    ctx.beginPath();
    ctx.arc(px, py, 1.5 + Math.sin(t * 0.03 + i) * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';

  // Title
  if (t > 20) {
    const titleAlpha = Math.min(1, (t - 20) / 40);
    ctx.globalAlpha = titleAlpha;
    ctx.shadowColor = COL.spice;
    ctx.shadowBlur = 15;
    ctx.fillStyle = COL.textBright;
    ctx.font = 'bold 32px "Courier New"';
    ctx.fillText('SHAI-HULUD CAPTURED', W / 2, 70);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Story lines appearing one by one
  let lineY = H / 2 - 60;
  for (const line of captureLines) {
    if (t > line.time) {
      const lineAlpha = Math.min(1, (t - line.time) / 40);
      ctx.globalAlpha = lineAlpha;
      if (line.text.startsWith('"')) {
        ctx.fillStyle = COL.spice;
        ctx.font = 'italic 16px "Courier New"';
      } else if (line.text.startsWith('Destroy') || line.text.startsWith('Find')) {
        ctx.fillStyle = COL.textBright;
        ctx.font = 'bold 18px "Courier New"';
      } else {
        ctx.fillStyle = COL.text;
        ctx.font = '16px "Courier New"';
      }
      ctx.fillText(line.text, W / 2, lineY);
    }
    lineY += 30;
  }
  ctx.globalAlpha = 1;

  // Continue prompt (after the full narration has played)
  if (t > 1010) {
    if (Math.floor(t / 30) % 2 === 0) {
      ctx.fillStyle = COL.textBright;
      ctx.font = 'bold 16px "Courier New"';
      ctx.fillText('PRESS SPACE TO RIDE THE WORM', W / 2, H - 40);
    }
  }

  ctx.textAlign = 'left';
}

let coronationTimer = 0;
// time = frame the line (and its voice-over) starts; spaced to each clip's length
const coronationLines = [

function drawCoronation() {

  // Coronation scene, full-screen with a slow ceremonial zoom
  const bgImg = spriteImages.coronation;
  if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
    const fadeIn = Math.min(1, t / 60);

  } else {
    ctx.fillStyle = '#1a1206';

  topGrad.addColorStop(1, 'rgba(0,0,0,0)');

  // Bottom panel for the narration
  const botGrad = ctx.createLinearGradient(0, H - 200, 0, H);
  botGrad.addColorStop(0, 'rgba(0,0,0,0)');
  botGrad.addColorStop(0.4, 'rgba(0,0,0,0.78)');
  botGrad.addColorStop(1, 'rgba(0,0,0,0.92)');
  ctx.fillStyle = botGrad;
  ctx.fillRect(0, H - 200, W, 200);

  // Floating spice motes
  for (let i = 0; i < 22; i++) {
    const px = (i * 89 + t * 0.35 + i * i * 11) % W;
    const py = (i * 53 + t * 0.2 + i * 9) % H;
    const bright = Math.sin(t * 0.04 + i * 2) * 0.3 + 0.5;

    ctx.fillStyle = COL.spiceGlow;
    ctx.beginPath();
    ctx.arc(px, py, 1.4 + Math.sin(t * 0.03 + i) * 0.8, 0, Math.PI * 2);

  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';

  // Title
  if (t > 20) {

    ctx.shadowColor = COL.spice;
    ctx.shadowBlur = 16;
    ctx.fillStyle = COL.textBright;
    ctx.font = 'bold 30px "Courier New"';
    ctx.fillText('MUAD\'DIB ASCENDS', W / 2, 52);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Narration lines appearing one by one in the bottom panel
  let lineY = H - 150;
  for (const line of coronationLines) {
    if (t > line.time) {
      ctx.globalAlpha = Math.min(1, (t - line.time) / 40);
      if (line.text.startsWith('"')) {
        ctx.fillStyle = COL.spice;
        ctx.font = 'italic 17px "Courier New"';
      } else {
        ctx.fillStyle = COL.text;
        ctx.font = '15px "Courier New"';
      }
      ctx.fillText(line.text, W / 2, lineY);
    }
    lineY += 28;
  }
  ctx.globalAlpha = 1;

  // Continue prompt after the full narration has played
  if (t > 1090 && Math.floor(t / 30) % 2 === 0) {
    ctx.fillStyle = COL.textBright;
    ctx.font = 'bold 15px "Courier New"';
    ctx.fillText('PRESS SPACE', W / 2, H - 14);

  ctx.textAlign = 'left';

function drawPause() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = COL.textBright;
  ctx.font = 'bold 32px "Courier New"';
  ctx.fillText('PAUSED', W/2, H/2 - 10);

  ctx.fillStyle = COL.text;
  ctx.font = '16px "Courier New"';
  ctx.fillText('Press ESC to continue', W/2, H/2 + 25);

}

// ============================================================
// SAVE / LOAD SYSTEM
// ============================================================
const SAVE_KEY = 'dune_sands_save';

function saveGame() {
  const data = {
    screen: currentScreen,
    px: player.x, py: player.y,
    hp: player.hp, maxHp: player.maxHp,
    keys: player.keys, spice: player.spice,
    dir: player.dir,
    hasThumper: player.hasThumper,
    hasShield: player.hasShield,
    hasPistol: player.hasPistol,
    spiceCollected,
    defeatedEnemies,
    collectedItems,
    bossDefeated,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    currentScreen = data.screen;
    player.x = data.px; player.y = data.py;
    player.hp = data.hp; player.maxHp = data.maxHp;
    player.keys = data.keys; player.spice = data.spice;
    player.dir = data.dir || 'down';
    player.hasThumper = data.hasThumper || false;
    player.hasShield = data.hasShield || false;
    player.shieldTimer = 0;
    player.hasPistol = data.hasPistol || false;
    player.pistolCooldown = 0;
    player.attacking = false;
    player.invulnerable = 60;
    spiceCollected = data.spiceCollected || {};
    defeatedEnemies = data.defeatedEnemies || {};
    collectedItems = data.collectedItems || {};
    bossDefeated = data.bossDefeated || false;
    particles = [];
    projectiles = [];
    shakeTime = 0;
    loadScreen(currentScreen);
    return true;
  } catch(e) { return false; }
}

function hasSaveData() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e) { return false; }
}

function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

// ============================================================
// GAME LOOP
// ============================================================
let paused = false;
let lastTime = 0;

function stepGame() {
  frameCount++;

  // High-res rendering
  ctx.save();
  ctx.scale(RENDER_SCALE, RENDER_SCALE);

  // Clear
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  switch(gameState) {
    case 'title': {
      drawTitle();
      // Any key/click starts title music (browser requires user interaction)
      if (!titleMusicStarted) {
        for (const k in keys) {
          if (keys[k]) { playMusic(musicTitle); titleMusicStarted = true; break; }
        }
      }
      // Navigate the level-select menu
      const menu = getTitleMenu();
      if (titleSelection >= menu.length) titleSelection = menu.length - 1;
      if (wasPressed('ArrowUp')) titleSelection = (titleSelection - 1 + menu.length) % menu.length;
      if (wasPressed('ArrowDown')) titleSelection = (titleSelection + 1) % menu.length;
      if (wasPressed('Enter') || wasPressed('Space')) {
        menu[titleSelection].action();
        break;
      }
      // Quick-jump hotkeys (still available)
      if (wasPressed('KeyS')) { initAudio(); initSandrider(); gameState = 'sandrider'; }
      if (wasPressed('KeyO')) { initAudio(); initThopter(); gameState = 'thopter'; }
      if (wasPressed('KeyP')) { initAudio(); initPlatformer(); gameState = 'platformer'; }
      if (wasPressed('KeyT')) { initAudio(); gameState = 'worm_captured'; wormCapturedTimer = 0; }
      if (wasPressed('KeyC') && hasSaveData()) { continueGame(); }
      break;
    }

    case 'playing':
      if (wasPressed('Escape')) { paused = !paused; }
      if (paused) {
        drawScreen();
        drawItems();
        drawNPCs();
        enemies.forEach(drawEnemy);
        if (boss) drawBoss(boss);
        drawPlayer();
        drawProjectiles();
        drawHUD();
        drawPause();
        break;
      }

      // Update
      unstickPlayer();

      // Thumper activation state machine
      if (currentScreen === '3,3' && thumperState) {
        if (thumperState === 'prompt' && wasPressed('KeyT')) {
          thumperState = 'planting';
          thumperTimer = 40;
          thumperX = player.x + player.w / 2;
          thumperY = player.y + player.h;
          sfx('thumper_boom');
        }
        if (thumperState === 'planting') {
          thumperTimer--;
          // Freeze player during planting
          player.moving = false;
          if (thumperTimer <= 0) {
            thumperState = 'thumping';
            thumperTimer = 120;
          }
        }
        if (thumperState === 'thumping') {
          thumperTimer--;
          const progress = 1 - thumperTimer / 120; // 0→1
          // Rhythmic thumps that get faster
          const interval = Math.max(4, Math.floor(20 - progress * 16));
          if (thumperTimer % interval === 0) {
            sfx('thumper_boom');
            shake(2 + progress * 8, interval);
            spawnParticles(thumperX, thumperY, COL.sandDark, Math.floor(2 + progress * 8), 1 + progress * 3, 25);
          }
          // Freeze player
          player.moving = false;
          if (thumperTimer <= 0) {
            thumperState = 'summoning';
            thumperTimer = 60;
            sfx('worm_emerge');
            shake(15, 60);
            // Big sand eruption
            spawnParticles(W / 2, H / 2, COL.sandDark, 30, 5, 50);
            spawnParticles(W / 2, H / 2, COL.spice, 15, 4, 40);
          }
        }
        if (thumperState === 'summoning') {
          thumperTimer--;
          // Continuous sand particles during emergence
          if (thumperTimer % 3 === 0) {
            spawnParticles(W / 2 + (Math.random() - 0.5) * 80, H / 2, COL.sandDark, 3, 3, 30);
          }
          if (thumperTimer <= 0) {
            boss = createBoss();
            playMusic(musicBoss);
            showMessage('Shai-Hulud has risen!', 120);
            thumperState = null;
          }
        }
      }

      if (!thumperState || thumperState === 'prompt') updatePlayer();
      else if (thumperState) { /* player frozen during thumper sequence */ }
      checkDoorUnlock();
      enemies.forEach(e => updateEnemy(e));
      if (boss) updateBoss(boss);
      updateProjectiles();
      handleCombat();
      checkEnemyCollision();
      updateParticles();
      if (shakeTime > 0) shakeTime--;

      // Walking dust particles
      if (player.moving && frameCount % 6 === 0) {
        const isFortress = currentScreen.startsWith('3,') && parseInt(currentScreen.split(',')[1]) >= 1;
        if (!isFortress) {
          spawnParticles(player.x + player.w/2, player.y + player.h + 2, COL.sandDark, 1, 0.8, 15);
        }
      }

      // Draw with screen shake
      ctx.save();
      if (shakeTime > 0) {
        ctx.translate(
          (Math.random() - 0.5) * shakeIntensity,
          (Math.random() - 0.5) * shakeIntensity
        );
      }

      drawScreen();
      drawItems();
      drawNPCs();
      enemies.forEach(drawEnemy);
      if (boss) drawBoss(boss);
      drawPlayer();
      drawProjectiles();
      drawParticles();

      // Draw thumper on ground during activation sequence
      if (thumperState === 'planting' || thumperState === 'thumping' || thumperState === 'summoning') {
        ctx.save();
        // Thumper device on the ground
        const tImg = spriteImages.item_thumper;
        if (tImg && tImg.complete) {
          ctx.drawImage(tImg, thumperX - 12, thumperY - 24, 24, 32);
        } else {
          ctx.fillStyle = '#888';
          ctx.fillRect(thumperX - 5, thumperY - 20, 10, 24);
          ctx.fillStyle = '#666';
          ctx.fillRect(thumperX - 3, thumperY - 22, 6, 4);
        }
        // Pulse rings during thumping
        if (thumperState === 'thumping' || thumperState === 'summoning') {
          const numRings = thumperState === 'summoning' ? 3 : 2;
          for (let r = 0; r < numRings; r++) {
            const phase = ((frameCount + r * 13) % 30) / 30;
            const radius = phase * 40 + 5;
            ctx.globalAlpha = (1 - phase) * 0.6;
            ctx.strokeStyle = COL.spice;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(thumperX, thumperY, radius, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        // Planting animation — player kneeling indicator
        if (thumperState === 'planting') {
          const alpha = 0.5 + Math.sin(frameCount * 0.3) * 0.3;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = COL.spice;
          ctx.font = '10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('* planting *', thumperX, thumperY - 30);
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      // Player shield visual
      if (player.hasShield && player.shieldTimer <= 0) {
        ctx.globalAlpha = 0.15 + Math.sin(frameCount * 0.1) * 0.05;
        ctx.strokeStyle = '#4AF';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(player.x + player.w/2, player.y + player.h/2, player.w/2 + 4, player.h/2 + 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      ctx.restore();
      drawHUD();
      drawDialog();

      // Sand ambient particles (sparse)
      if (frameCount % 20 === 0) {
        const isFortress = currentScreen.startsWith('3,') && parseInt(currentScreen.split(',')[1]) >= 1;
        if (!isFortress) {
          spawnParticles(
            Math.random() * W, Math.random() * H,
            COL.sandDark, 1, 0.5, 40
          );
        }
      }
      break;

    case 'transition':
      transitionTimer--;
      // Draw both screens with slide effect
      const t = 1 - transitionTimer / 20;
      ctx.save();
      // Simple fade
      ctx.globalAlpha = t;
      drawScreen();
      drawItems();
      enemies.forEach(drawEnemy);
      if (boss) drawBoss(boss);
      drawPlayer();
      ctx.globalAlpha = 1;
      ctx.restore();
      drawHUD();

      if (transitionTimer <= 0) {
        gameState = 'playing';
        // Show room name for special areas
        if (currentScreen === '3,1') showMessage('Harkonnen Fortress', 90);
        if (currentScreen === '3,3' && !bossDefeated) {
          if (player.hasThumper) {
            showMessage('Lair of Shai-Hulud \u2014 Press T to plant the thumper', 180);
            thumperState = 'prompt';
          } else {
            showMessage('You need the thumper to awaken Shai-Hulud...', 150);
            thumperState = null;
          }
        } else if (currentScreen === '3,3' && bossDefeated) {
          showMessage('Lair of Shai-Hulud', 90);
        }
        if (currentScreen !== '3,3' && currentMusic === musicBoss) { playMusic(musicGameplay); }
      }
      break;

    case 'gameover':
      stopMusic();
      drawScreen();
      drawPlayer();
      drawGameOver();
      if (wasPressed('Space')) {
        gameState = 'playing';
        playMusic(musicGameplay);
        resetGame();
      }
      break;

    case 'worm_captured':
      wormCapturedTimer++;
      if (currentMusic !== musicVictory) playMusic(musicVictory);
      // Fire each narrator line exactly once, as its text appears
      for (let i = 0; i < captureLines.length; i++) {
        if (wormCapturedTimer === captureLines[i].time && captureVoice[i]) {
          captureVoice[i].currentTime = 0;
          captureVoice[i].play().catch(() => {});
        }
      }
      drawWormCaptured();
      // Skippable after the first line; prompt shown once narration finishes
      if (wormCapturedTimer > 200 && wasPressed('Space')) {
        stopCaptureVoice();
        initSandrider();
        gameState = 'sandrider';
      }
      break;

    case 'coronation':
      coronationTimer++;
      if (currentMusic !== musicVictory) playMusic(musicVictory);
      // Fire each narrator line exactly once, as its text appears
      for (let i = 0; i < coronationLines.length; i++) {
        if (coronationTimer === coronationLines[i].time && coronationVoice[i]) {
          coronationVoice[i].currentTime = 0;
          coronationVoice[i].play().catch(() => {});
        }
      }
      drawCoronation();
      // Skippable after the first line; prompt shown once narration finishes
      if (coronationTimer > 200 && wasPressed('Space')) {
        stopCoronationVoice();
        gameState = 'victory';
      }
      break;

    case 'victory':
      if (currentMusic !== musicVictory) playMusic(musicVictory);
      drawVictory();
      if (wasPressed('Space')) {
        gameState = 'title';
        titleMusicStarted = false;
      }
      break;

    case 'sandrider':
      updateSandrider();
      drawSandrider();
      break;

    case 'thopter':
      updateThopter();
      drawThopter();
      break;

    case 'platformer':
      updatePlatformer();
      drawPlatformer();
      break;
  }

  ctx.restore(); // end RENDER_SCALE

  // Clear pressed keys at end of frame
  Object.keys(keysPressed).forEach(k => keysPressed[k] = false);
}

// Fixed-timestep driver: run game logic at a constant 60 Hz regardless of the
// display's refresh rate (60/100/120/144 Hz all play at the same speed).
const FRAME_MS = 1000 / 60;
let _accum = 0;
let _lastTime = null;
function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (_lastTime === null) _lastTime = time;
  let delta = time - _lastTime;
  _lastTime = time;
  if (delta > 250) delta = 250; // clamp after tab switch / stalls
  _accum += delta;
  let steps = 0;
  while (_accum >= FRAME_MS && steps < 5) {
    stepGame();
    _accum -= FRAME_MS;
    steps++;
  }
}

// Start
requestAnimationFrame(gameLoop);
</script>
