<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- the SVG is rasterised through a data: image; nothing external is loaded -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:"
    />
    <title>Diagram renderer</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Hidden window: the main process calls window.renderDiagram(code, theme, scale) (see main/diagram-window.ts) -->
    <script type="module" src="./diagram.ts"></script>
  </body>
</html>
